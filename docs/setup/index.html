<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set up Expense Tracker</title>
<!--
  The installer for friends & family (stage 4a; built from the setup test page, docs/setup-test/).
  It creates a private Google Sheet and the app's own backend (from this public repo, at the pinned
  version named in pin.json) in the Google account of whoever signs in, then hands the person to the app.
  The person can choose optional extras BEFORE setup (one Google approval covers them) or turn them on
  LATER from this same page (a second approval, on a side copy so the app keeps working meanwhile).
  Holds nothing private: the Client ID is a public identifier. Explanations follow the phone's language
  (Spanish or English); the log stays in English (it is for diagnosis).
  Wording rule (owner, 2026-10-14): never say "copy" or "tracker" to the person — it is "your app"
  (and "your Google Sheet" for the spreadsheet).
-->
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1c; --muted:#3f3f3f; --card:#fff; --line:#d9d9d4; --ok:#14684a; --bad:#b3261e; --accent:#1f5fbf; --note:#eaf1fc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#f1f1f1; --muted:#c4c4c4; --card:#1f1f1f; --line:#3a3a3a; --ok:#4cc38a; --bad:#ff8a80; --accent:#8db3ff; --note:#1d2533; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.5 -apple-system, Helvetica, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; line-height:1.25; margin:8px 0 12px; }
  .banner { background:#fff3cd; color:#5c4400; border-radius:10px; padding:10px 12px; font-size:15px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .step h3 { margin:0 0 8px; font-size:20px; line-height:1.25; }
  .step p { margin:8px 0; color:var(--muted); font-size:17px; }
  .step ol, .step ul { padding-left:22px; }
  .ask { background:var(--note); border-radius:10px; padding:12px 14px; font-size:17px; margin:10px 0; }
  .ask b { display:inline; }
  .ask ul { margin:6px 0 0; padding-left:20px; }
  .ask li { margin:4px 0; }
  .ask p { margin:8px 0 0; }
  button { font:inherit; font-weight:700; font-size:19px; padding:16px 18px; border-radius:12px; border:0; background:var(--accent); color:#fff; width:100%; margin-top:8px; min-height:56px; }
  @media (prefers-color-scheme: dark) { button { color:#0b1530; } }
  button.secondary { background:transparent; color:var(--accent); border:2px solid var(--line); font-size:17px; }
  button:disabled { opacity:.5; }
  button.busy { opacity:1; position:relative; padding-left:48px; text-align:left; }
  button.busy::before { content:""; position:absolute; left:16px; top:50%; width:20px; height:20px; margin-top:-10px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 0.9s linear infinite; }
  @media (prefers-color-scheme: dark) { button.busy::before { border-color:rgba(11,21,48,.3); border-top-color:#0b1530; } }
  button.donebtn { background:var(--ok); opacity:1; }
  @media (prefers-color-scheme: dark) { button.donebtn { color:#06240f; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .done { color:var(--ok); font-weight:700; }
  .err { color:var(--bad); font-weight:700; }
  .callout { background:#fff3cd; color:#3d2e00; border-radius:14px; padding:16px; margin:12px 0; }
  .callout h3 { margin:0 0 8px; font-size:20px; }
  .callout ol { margin:8px 0 12px; padding-left:22px; }
  .callout p { font-size:17px; }
  .bigbtn { display:block; text-align:center; font-weight:700; font-size:19px; padding:16px; border-radius:12px; background:var(--accent); color:#fff !important; text-decoration:none; }
  @media (prefers-color-scheme: dark) { .bigbtn { color:#0b1530 !important; } }
  #log { font:12px/1.4 ui-monospace, Menlo, monospace; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 10px 10px 30px; max-height:320px; overflow:auto; }
  #log li.bad { color:var(--bad); } #log li.ok { color:var(--ok); }
  a { color:var(--accent); }
  .small { font-size:15px; }
  summary { font-weight:700; font-size:19px; cursor:pointer; }
  details.step[open] summary { margin-bottom:8px; }
  .opt { display:flex; gap:12px; align-items:flex-start; margin:12px 0; font-size:17px; color:var(--muted); }
  .opt input { width:26px; height:26px; flex:none; margin-top:2px; }
  /* general status, always visible at the top */
  .topstatus { position:sticky; top:0; z-index:10; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .topstatus .tsHead { display:flex; justify-content:space-between; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .topstatus #tsText { font-size:19px; font-weight:700; margin:4px 0 8px; }
  .topstatus .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  .topstatus #tsBar { height:100%; width:0; background:var(--accent); border-radius:6px; transition:width .5s ease; }
  .topstatus.running { border-color:var(--accent); }
  .topstatus.ok { border-color:var(--ok); } .topstatus.ok #tsBar { background:var(--ok); width:100% !important; } .topstatus.ok #tsText { color:var(--ok); }
  .topstatus.err { border-color:var(--bad); } .topstatus.err #tsBar { background:var(--bad); width:100% !important; } .topstatus.err #tsText { color:var(--bad); }
  .topstatus.idle .bar, .topstatus.wait .bar { display:none; }
  #tsKeep { margin-top:8px; color:var(--muted); }
  .step input[type=text] { font:inherit; font-size:18px; width:100%; box-sizing:border-box; padding:12px; margin:4px 0 8px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  #shareCard label.small { display:block; color:var(--muted); }
  button.danger { background:var(--bad); }
  .linkbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:16px; font-weight:600; text-decoration:underline; padding:4px 0; margin:0; width:auto; min-height:0; display:inline; }
  .callout .linkbtn { color:inherit; }
  .acctbar { margin:4px 0 10px; }
  .acctbar .linkbtn { font-size:inherit; margin-left:6px; }
  #moreOverlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
  #moreOverlay[hidden] { display:none; }
  #moreSheet { background:var(--card); color:var(--fg); width:100%; max-width:560px; max-height:85vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 16px 24px; box-sizing:border-box; }
  #moreSheet p, #moreSheet li { color:var(--fg); font-size:17px; }
  /* A plain list, not circles: round marks looked like buttons or radio choices (owner, 2026-10-24). */
  #tracker ol { list-style:none; margin:6px 0 0; padding:0; }
  #tracker li { display:flex; align-items:baseline; gap:10px; padding:6px 0; font-size:18px; color:var(--muted); cursor:default; }
  #tracker .dot { flex:none; width:1.4em; font-size:21px; line-height:1; text-align:center; font-weight:700; color:var(--muted); }
  #tracker li.now { color:var(--fg); font-weight:700; }
  #tracker li.now .dot { color:var(--accent); }
  #tracker li.done { color:var(--ok); }
  #tracker li.done .dot { color:var(--ok); animation:pop .35s ease; }
  .step.complete { border-color:var(--ok); }
  .step.complete > h3::before { content:"✓ "; color:var(--ok); }
  #sheetNote { margin-top:12px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; background:transparent; color:var(--muted); font-size:15px; }
  #sheetNote b { display:block; font-size:14px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  #sheetNote p { margin:2px 0; font-size:15px; }
  @keyframes pop { 0% { transform:scale(.4); } 70% { transform:scale(1.2); } 100% { transform:scale(1); } }
  @media (prefers-reduced-motion: reduce) { #tracker li.done .dot { animation:none; } }
  .anim { margin:12px 0 6px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-y; }
  .anim .acap { min-height:5.2em; margin:12px 2px 4px; font-size:18px; line-height:1.4; font-weight:600; color:var(--fg); }
  .anim .note { font-size:13px; line-height:1.35; color:var(--muted); margin:4px 2px 0; }
  .anim .actl button { margin-top:4px; }
  .anim .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  /* the drawn phone: always light, like Google's own pages; fills the card up to a phone's width */
  .mock { position:relative; width:100%; max-width:310px; height:400px; margin:0 auto; border:6px solid #2b2b2b; border-radius:28px; background:#fff; overflow:hidden; color:#202124; font:14px/1.4 Roboto, Arial, sans-serif; text-align:left; box-sizing:border-box; }
  .anim.paused .mock::after { content:"❚❚"; position:absolute; right:10px; bottom:10px; z-index:6; background:rgba(32,33,36,.8); color:#fff; font-size:12px; letter-spacing:-2px; padding:5px 8px 5px 6px; border-radius:12px; }
  .msc { position:absolute; inset:0; box-sizing:border-box; opacity:0; pointer-events:none; transition:opacity .3s; overflow:hidden; background:#fff; }
  .msc.on { opacity:1; }
  .msc .sc { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; padding:22px 14px 12px; transition:transform .7s ease; }
  .msc .gh { display:flex; align-items:center; gap:8px; font-size:13px; color:#5f6368; padding-bottom:8px; border-bottom:1px solid #eee; margin-bottom:12px; }
  .msc .gl { font-size:20px; font-weight:700; color:#4285f4; line-height:1; }
  .msc h4 { margin:6px 0 10px; font-size:23px; line-height:1.2; font-weight:400; color:#202124; }
  .msc h5 { margin:12px 0 4px; font-size:15px; font-weight:400; line-height:1.3; color:#202124; }
  .msc h5 b { color:#1a73e8; font-weight:500; }
  .msc .sk { display:block; height:9px; border-radius:4px; background:#dadce0; margin:8px 0; }
  .msc .sk.s { width:55%; } .msc .sk.m { width:82%; }
  .msc .acct { display:flex; gap:10px; align-items:center; border:1px solid #dadce0; border-radius:8px; padding:10px; margin:8px 0; }
  .msc .acct.line { border:0; border-top:1px solid #dadce0; border-bottom:1px solid #dadce0; border-radius:0; }
  .msc .av { flex:none; width:30px; height:30px; border-radius:50%; background:#9aa0a6; color:#fff; text-align:center; line-height:30px; font-weight:700; }
  .msc .warn { font-size:38px; color:#d93025; line-height:1; margin-top:6px; }
  .msc .row { display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px; gap:8px; }
  .msc .lnk { color:#1a73e8; font-size:14px; padding:4px 2px; text-decoration:underline; }
  .msc .lnk.small { color:#3c4043; font-size:13px; }
  .msc .bigb { position:relative; background:#1a73e8; color:#fff; border-radius:4px; padding:9px 10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; text-align:center; }
  .msc .nope { position:absolute; right:-7px; top:-10px; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; background:#d93025; color:#fff; font-style:normal; font-size:13px; }
  .msc .adv { display:none; }
  .msc .adv.open { display:block; }
  .msc .chkrow { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #eee; }
  .msc .chkrow .t { flex:1; min-width:0; }
  .msc .cb { flex:none; width:18px; height:18px; margin-top:1px; border:2px solid #5f6368; border-radius:3px; box-sizing:border-box; position:relative; }
  .msc .cb.chk { background:#1a73e8; border-color:#1a73e8; }
  .msc .cb.chk::after { content:"✓"; position:absolute; left:2px; top:-3px; color:#fff; font-size:14px; font-weight:700; }
  .msc .ic { flex:none; width:18px; height:18px; border-radius:4px; margin-top:1px; }
  .msc .info { background:#e8f0fe; border-radius:10px; padding:10px 12px; margin:14px 0 8px; font-size:13px; color:#1a73e8; }
  .msc .btns { display:flex; gap:8px; margin:16px 0 8px; }
  .msc .gb { flex:1; text-align:center; border:1px solid #dadce0; border-radius:20px; padding:8px 0; color:#1a73e8; font-weight:600; font-size:14px; }
  .msc .gbtn { align-self:flex-start; margin-top:16px; background:#188038; color:#fff; font-weight:700; border-radius:6px; padding:14px 20px; font-size:18px; }
  .msc .gfoot { margin-top:auto; padding-top:16px; display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; color:#5f6368; }
  .msc .banner { background:#e8f0fe; color:#1967d2; font-size:12px; padding:8px 10px; margin:-22px -14px 14px; }
  /* Google's Apps Script settings page */
  .msc .top { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid #eee; background:#fff; margin:-22px -14px 0; padding-top:24px; }
  .msc .top .ham { font-size:18px; color:#5f6368; }
  .msc .top .logo { font-weight:600; color:#3c4043; font-size:14px; white-space:nowrap; }
  .msc .top .logo i { display:inline-block; width:14px; height:14px; border-radius:3px; background:linear-gradient(135deg,#4285f4 0 33%,#ea4335 33% 66%,#fbbc04 66%); margin-right:4px; vertical-align:-2px; }
  .msc .top .search { flex:1; min-width:0; background:#f1f3f4; border-radius:6px; padding:5px 8px; font-size:12px; color:#5f6368; white-space:nowrap; overflow:hidden; }
  .msc .top .av2 { flex:none; width:22px; height:22px; border-radius:50%; background:#5f6368; color:#fff; font-size:11px; text-align:center; line-height:22px; }
  .msc .crumb { display:flex; gap:8px; align-items:center; padding:12px 0 8px; font-size:14px; color:#3c4043; }
  .msc .band { display:flex; justify-content:space-between; align-items:center; background:#e8f0fe; margin:0 -14px; padding:12px 14px; font-size:13px; font-weight:600; color:#202124; }
  .msc .sw { position:relative; width:36px; height:14px; border-radius:7px; background:#bdc1c6; transition:background .3s; flex:none; margin-right:4px; }
  .msc .sw::after { content:""; position:absolute; top:-3px; left:-2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.45); transition:left .3s, background .3s; }
  .msc .sw.on { background:#8ab4f8; } .msc .sw.on::after { left:18px; background:#1a73e8; }
  .msc .listrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 10px; border-bottom:1px solid #eee; font-size:15px; color:#202124; }
  .msc .listrow.sel { background:#e8f0fe; font-weight:600; }
  .msc .apiinfo { display:flex; gap:10px; margin-top:14px; font-size:12px; color:#3c4043; }
  .msc .apiinfo ul { margin:6px 0 0; padding-left:16px; }
  .msc .apiinfo li { margin:3px 0; }
  .msc .ourpage { padding:6px 4px; }
  .msc .ourpage h4 { font:700 22px/1.25 -apple-system, Helvetica, sans-serif; margin-top:14px; }
  .msc .ourstatus { border:2px solid #d9d9d4; border-radius:14px; padding:14px; margin:14px 0; font:18px/1.3 -apple-system, Helvetica, sans-serif; color:#1c1c1c; }
  .msc .ourbtn { display:block; text-align:center; background:#1f5fbf; color:#fff; font:700 18px/1.2 -apple-system, Helvetica, sans-serif; padding:20px 8px; border-radius:12px; margin:18px 0; }
  .msc .ourbox { background:#fff3cd; color:#3d2e00; border-radius:12px; padding:12px; font:17px/1.4 -apple-system, Helvetica, sans-serif; }
  .mock .finger { position:absolute; left:50%; top:60%; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%; background:rgba(40,40,40,.45); border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); opacity:0; transition:left .8s ease, top .8s ease, opacity .3s; pointer-events:none; z-index:5; }
  .mock .finger.show { opacity:1; }
  .mock .finger.press { animation:tap .4s ease; }
  .msc .hl { outline:3px solid #f9ab00; outline-offset:2px; border-radius:4px; }
  @keyframes tap { 50% { transform:scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .msc, .msc .sc, .mock .finger, .msc .sw, .msc .sw::after { transition:none; } .mock .finger.press { animation:none; } }
  body.removing main >:not(#removeCard):not(#topStatus):not(#helpBox):not(#acctBar):not(.langrow):not(h1):not(#moreOverlay) { display:none !important; }
  body.updating main >:not(#updateCard):not(#topStatus):not(#helpBox):not(#acctBar):not(.langrow):not(h1):not(#moreOverlay) { display:none !important; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../signin-link.js"></script>
<script src="../perf-share.js"></script>
</head>
<body>
<main>
  <p class="small langrow" style="text-align:right;margin:0"><a href="#" data-lang="es">Español</a> · <a href="#" data-lang="en">English</a></p>
  <h1 data-t="title"></h1>
  <p class="small acctbar" id="acctBar"><span id="acct"></span><button class="linkbtn" id="btnChangeAcct" type="button" hidden data-t="changeAcct"></button></p>
  <p class="banner" id="inAppWarn" hidden data-t="inAppWarn"></p>

  <div class="topstatus idle" id="topStatus" role="status" aria-live="polite">
    <div class="tsHead"><span id="tsStep"></span><span id="tsTime"></span></div>
    <div id="tsText"></div>
    <div class="bar"><div id="tsBar"></div></div>
    <div id="tsKeep" class="small" hidden data-t="keepOpen"></div>
    <button class="secondary" id="btnCancel" data-keep hidden data-t="cancelBtn"></button>
  </div>

  <div class="callout" id="privateTip">
    <h3 data-t="privateTitle"></h3>
    <div><span data-t="privateShort"></span> <button class="linkbtn" data-more="privateBody"></button></div>
    <button id="btnCopyPrivate" data-t="copyPageBtn"></button>
  </div>

  <div class="callout"><span data-t="accountTip"></span> <button class="linkbtn" data-more="accountTipMore"></button></div>

  <div class="step" id="signinCard" hidden>
    <h3 id="signinTitle" data-t="signinTitle"></h3>
    <p id="signinBody" data-t="signinBody"></p>
    <button id="btnSignin" data-t="signinBtn"></button>
  </div>

  <div class="step" id="overview">
    <h3 data-t="whatTitle"></h3>
    <ol data-t="what"></ol>
  </div>

  <div class="step" id="tracker" aria-live="polite">
    <h3 data-t="stepsTitle"></h3>
    <ol>
      <li id="trSheet"><span class="dot">✓</span><span data-t="trSheet"></span></li>
      <li id="trApp"><span class="dot">✓</span><span data-t="trApp"></span></li>
      <li id="trAllow"><span class="dot">✓</span><span data-t="trAllow"></span></li>
      <li id="trOpen"><span class="dot">✓</span><span data-t="trOpen"></span></li>
    </ol>
  </div>

  <div class="step" id="removeCard" hidden>
    <h3 data-t="rmTitle"></h3>
    <p data-t="rmBody"></p>
    <div id="sRm"></div>
    <button id="btnRemove" class="danger" data-t="rmBtn"></button>
    <div id="rmDone" hidden>
      <p data-t="rmAfter"></p>
      <a class="bigbtn" href="https://myaccount.google.com/connections" target="_blank" rel="noopener" data-t="rmOpenGoogle"></a>
    </div>
  </div>

  <div class="step" id="updateCard" hidden>
    <h3 data-t="updTitle"></h3>
    <p data-t="updBody"></p>
    <div id="sUpd"></div>
    <button id="btnUpdate" data-t="updBtn"></button>
  </div>

  <div class="callout" id="openHelp" hidden>
    <h3 data-t="openHelpTitle"></h3>
    <div data-t="openHelpBody"></div>
    <button id="btnCopyPage" data-t="copyPageBtn"></button>
  </div>

  <div class="step" id="choices">
    <h3 data-t="choicesTitle"></h3>
    <p id="choicesIntroP"><span data-t="choicesIntro"></span> <button class="linkbtn" data-more="choicesIntroMore"></button></p>
    <label class="opt"><input type="checkbox" id="optAwake"><span><span data-t="optAwakeLabel"></span> <button type="button" class="linkbtn" data-more="optAwakeMore"></button></span></label>
    <label class="opt"><input type="checkbox" id="optGmail"><span><span data-t="optGmailLabel"></span> <button type="button" class="linkbtn" data-more="optGmailMore"></button></span></label>
    <p class="small" id="choicesSummary"></p>
    <div id="sAdd"></div>
    <button id="btnAdd" data-t="addBtn" hidden></button>
    <button class="secondary" id="btnContinueAdd" data-t="retryBtn" hidden></button>
  </div>

  <div class="callout" id="switchCard">
    <h3 data-t="switchTitle"></h3>
    <p style="color:inherit" data-t="switchIntro"></p>
    <div class="anim" id="anim-api" data-anim="api"></div>
    <a class="bigbtn" id="settingLink" href="https://script.google.com/home/usersettings" target="_blank" rel="noopener" data-t="switchBtn"></a>
    <p id="apiWait" style="color:inherit;margin-top:10px"></p>
  </div>

  <div class="step" id="shareCard">
    <h3 data-t="shareTitle"></h3>
    <p><span data-t="shareShort"></span> <button class="linkbtn" data-more="shareBody"></button></p>
    <label class="opt"><input type="checkbox" id="optShare" checked><span data-t="optShareLabel"></span></label>
    <label class="small" for="shareName" data-t="shareNameLabel"></label>
    <input type="text" id="shareName" maxlength="30" autocomplete="off">
    <details>
      <summary data-t="shareWhatSummary"></summary>

const WANT_REMOVE = /(^|[#&?])remove\b/.test(location.hash + location.search);   // the app's "Delete everything" opens this page that way

const WANT_UPDATE = /(^|[#&?])update\b/.test(location.hash + location.search);   // the app's "Update available" button opens this page that way
// An update asks Google for nothing new and touches nothing the install cards cover, so none of them belong on screen here —
// same trick as "removing" above (owner, 2026-10-24: the update page looked identical to a fresh install and confused people).
if (WANT_UPDATE) { document.body.classList.add('updating'); document.querySelector('h1').setAttribute('data-t', 'updPageTitle'); }
document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T[el.getAttribute('data-t')]; });
// "More info": the long explanation lives behind a tap, in a sheet of its own, so the page itself stays short.
document.querySelectorAll('[data-more]').forEach((b) => {
  b.textContent = T.moreLink;
  b.addEventListener('click', (ev) => { ev.preventDefault(); document.getElementById('moreBody').innerHTML = T[b.getAttribute('data-more')]; document.getElementById('moreOverlay').hidden = false; });
});
document.getElementById('moreClose').textContent = T.moreClose;
document.getElementById('moreClose').addEventListener('click', () => { document.getElementById('moreOverlay').hidden = true; });
document.getElementById('moreOverlay').addEventListener('click', (ev) => { if (ev.target === document.getElementById('moreOverlay')) document.getElementById('moreOverlay').hidden = true; });
document.querySelectorAll('[data-lang]').forEach((a) => a.addEventListener('click', (ev) => {
  ev.preventDefault();
  try { localStorage.setItem('setupLang', a.getAttribute('data-lang')); } catch (e) {}
  location.reload();
}));

async function google_(method, url, body) {
  const token = await getToken();
  let res, text;
  // GET and PUT can safely be repeated. Found 2026-10-15: one upload to Google sat silent for 48 s and then
  // failed with Safari's bare "Load failed"; no log line said which call. Now each try is cut off after 25 s
  // and repeated (3 tries), and every failure is logged with what was called and how long it took.

  for (let attempt = 1; ; attempt++) {
    const t0 = Date.now(), ctl = new AbortController(), cut = setTimeout(() => ctl.abort(), method === 'POST' ? 90000 : 25000);
    try {
      res = await fetch(url, { method, signal: ctl.signal, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      text = await res.text();
      clearTimeout(cut);
      break;
    } catch (e) {
      clearTimeout(cut);
      log('Google call failed (' + method + ' ' + url.split('?')[0].replace('https://', '') + ', try ' + attempt + ' of ' + tries + ', ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s): ' + e.message + '.', 'bad');
      if (attempt >= tries) { const err = new Error(T.netFail); err.network = true; throw err; }
      await sleep(1500 * attempt);
    }
  }
  let json = {};
  try { json = text ? JSON.parse(text) : {}; } catch (e) {}
  if (!res.ok) {
    const msg = (json.error && json.error.message) || text.slice(0, 300) || ('HTTP ' + res.status);
    const err = new Error(res.status === 429 || /rate limit|quota|too many/i.test(msg) ? T.tooBusy : res.status + ': ' + msg);
    err.apiOff = /Apps Script API|has not enabled|usersettings/i.test(msg);
    throw err;
  }
  return json;
}

async function saveProgress() {

// The apps this page makes carry the Drive mark etSetup. The OWNER's own leftover apps from the throwaway test page

// find those too (2026-10-21: it said "No app of yours was found" for the owner's spare account). Setting up never does, so a
// fresh setup is never mistaken for a resume.
async function restoreIfNeeded(includeTestApps) {
  if (state.spreadsheetId) return;
  const mark = includeTestApps
    ? "(appProperties has { key='etSetup' and value='1' } or appProperties has { key='setupTest' and value='1' })"
    : "appProperties has { key='etSetup' and value='1' }";
  const q = encodeURIComponent(mark + " and trashed=false");
  const res = await google_('GET', 'https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=createdTime%20desc&fields=files(id,webViewLink,appProperties)');

// ---------- the person's copy of the backend ----------
function ensureCode() {
  if (state.accessCode) return;
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  state.accessCode = [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
  save();
  log('Made a new access code on this phone (32 characters).');
}
function manifestFor(stages) {
  const scopes = new Set();
  stages.forEach((s) => (STAGE_SCOPES[s] || []).forEach((x) => scopes.add(x)));
  const m = {
    timeZone: 'America/Lima', exceptionLogging: 'STACKDRIVER', runtimeVersion: 'V8',
    webapp: { executeAs: 'USER_DEPLOYING', access: 'ANYONE_ANONYMOUS' },
    oauthScopes: [...scopes]

  if (stages.includes('gmail')) m.dependencies = { enabledAdvancedServices: [{ userSymbol: 'Gmail', serviceId: 'gmail', version: 'v1' }] };
  return JSON.stringify(m, null, 2);
}
let rawBackend = null;   // the backend files, fetched while the person reads this page
async function fetchRawBackend() {
  await pinReady;
  // The newest commit that changed backend/ (at the pin, or on main): the files come from it and the app is stamped with it.
  const head = pinned || 'main';
  if (!pinned) log('Not pinned: using the newest backend on GitHub.');
  const verRes = await fetch(REPO_API + '/commits?path=backend&sha=' + encodeURIComponent(head) + '&per_page=1');
  if (!verRes.ok) throw new Error('GitHub (newest backend version): HTTP ' + verRes.status);
  const ref = ((await verRes.json())[0] || {}).sha;
  if (!ref) throw new Error('GitHub: no backend version found');
  log('Backend version ' + ref.slice(0, 7) + '.');
  const listRes = await fetch('https://api.github.com/repos/' + REPO + '/contents/backend?ref=' + ref);
  if (!listRes.ok) throw new Error('GitHub file list: HTTP ' + listRes.status);
  const list = (await listRes.json()).filter((f) => f.type === 'file' && /\.gs$/.test(f.name));
  const files = await Promise.all(list.map(async (f) => {
    const r = await fetch(f.download_url);
    if (!r.ok) throw new Error('GitHub ' + f.name + ': HTTP ' + r.status);
    return { name: f.name.replace(/\.gs$/, ''), type: 'SERVER_JS', source: await r.text() };
  }));
  const firstRun = await fetch('Install.gs', { cache: 'no-store' });
  if (!firstRun.ok) throw new Error('Install.gs: HTTP ' + firstRun.status);
  return { files, firstRun: await firstRun.text(), stamp: ref };
}
const prefetched = fetchRawBackend().then((r) => { rawBackend = r; log('Backend files ready before they were needed.'); }).catch((e) => { log('Early download failed (will retry when needed): ' + e.message); });
async function backendFiles(release, stages, fresh) {
  const start = Date.now();
  if (!fresh) await prefetched;   // the early download is usually done already
  if (fresh || !rawBackend) rawBackend = await fetchRawBackend();
  const files = rawBackend.files.slice();
  files.push({ name: 'Install', type: 'SERVER_JS', source: rawBackend.firstRun.replace('__RELEASE__', release).replace('__CODE__', state.accessCode || '').replace('__MAINURL__', state.webAppUrl || '').replace('__FEATURES__', ['base'].concat((stages || []).filter((x) => x !== 'base')).join(',')).replace('__BACKENDREF__', rawBackend.stamp || '') });
  files.push({ name: 'appsscript', type: 'JSON', source: manifestFor(stages) });
  log('Fetched ' + files.length + ' backend files from GitHub (' + secs(start) + '); permissions: ' + stages.join(' + ') + '.');
  return files;
}
// A brand-new project is filled in by Google a moment AFTER it is created (a default code file and manifest).
// Hypothesis (2026-10-14): since the backend files are now downloaded in advance, our upload follows the project
// creation within a fraction of a second and can be overwritten by that late fill-in — leaving a project with no
// web app section, whose address Google then answers with "unable to open the file". The old page had a few
// seconds of other work in between. So: wait until the project is readable, pause, upload, then CHECK it stuck.
async function waitForProjectReady() {
  for (let i = 0; i < 10; i++) {
    try {
      const c = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content');
      if ((c.files || []).some((f) => f.name === 'appsscript')) { log('The new project is ready (' + c.files.length + ' starting files).', 'ok'); await sleep(2000); return; }
    } catch (e) { log('The new project is not readable yet: ' + e.message); }
    await sleep(1000);
  }
  log('The new project still was not readable after 10 s — continuing anyway.', 'bad');
}
async function verifyUpload(sent) {
  const c = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content');
  const names = (c.files || []).map((f) => f.name);
  const man = (c.files || []).find((f) => f.name === 'appsscript');
  const hasWeb = !!man && /"webapp"/.test(man.source);
  const hasInstall = names.includes('Install');
  log('Check after upload: Google holds ' + names.length + ' files (sent ' + sent + '), Install present: ' + hasInstall + ', manifest has the web app section: ' + hasWeb + '.', hasWeb && hasInstall ? 'ok' : 'bad');
  return hasWeb && hasInstall && names.length >= sent;
}
async function pushAndVersion(release, stages, label, basePct, fresh, texts) {
  texts = texts || { code: T.p_code, version: T.p_version };
  progress(texts.code, basePct, undefined, basePct + 18);
  const files = await backendFiles(release, stages, fresh);
  let start = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content', { files });
  log('Uploaded the code (' + secs(start) + ').', 'ok');

    log('The upload did not stick — sending it again.', 'bad');

    await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content', { files });
    if (!(await verifyUpload(files.length))) throw new Error('Google did not keep the uploaded code. Tap the button to try again.');
  }
  progress(texts.version, basePct + 20, undefined, basePct + 34);

// ---------- calling the backend exactly like the app does ----------
async function callBackend(body) {
  const start = Date.now();
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      const res = await fetch(state.webAppUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      const json = await res.json();
      json._ms = Date.now() - start;
      return json;
    } catch (e) {
      if (attempt === 4) throw new Error('Backend unreachable: ' + e.message);
      log('Backend slow to wake up, retrying…');
      await sleep(500 * attempt);
    }
  }
}
async function signIn() {
  const r = await callBackend({ action: 'login', payload: { code: state.accessCode, deviceName: 'Setup page' } });
  if (!r.ok) throw new Error('Sign-in failed: ' + r.error);
  state.sessionToken = r.data.sessionToken; save();
  log('Signed in to the backend (' + (r._ms / 1000).toFixed(1) + ' s' + (r.coldInstance ? ', cold start' : '') + ').', 'ok');
}
async function api(action, payload) {
  if (!state.sessionToken) await signIn();
  let r = await callBackend({ sessionToken: state.sessionToken, action, payload: payload || {} });
  if (!r.ok && r.code === 'invalid_access_code') { await signIn(); r = await callBackend({ sessionToken: state.sessionToken, action, payload: payload || {} }); }
  if (!r.ok) throw new Error(action + ' failed: ' + r.error);
  return r;
}
async function check(kind) {
  let text;
  try { text = await (await fetch(state.webAppUrl + '?check=' + kind, { cache: 'no-store' })).text(); }
  catch (e) { const err = new Error(T.netFail); err.network = true; log('Could not reach the app for "' + kind + '": ' + e.message + ' (address ends …' + String(state.webAppUrl).slice(-14) + ').', 'bad'); throw err; }
  try { return JSON.parse(text); } catch (e) { log('Backend answered with a page, not data: ' + text.slice(0, 120).replace(/\s+/g, ' '), 'bad'); throw new Error(T.blockedPage); }
}
async function waitForRelease(release) {
  let st;
  for (let i = 0; i < 8; i++) {
    try { st = await status(); } catch (e) { if (!e.network) throw e; await sleep(4000); continue; }   // Google is often unreachable for a few seconds while it switches versions
    if (st && st.release === release) return st;
    log('Google has not switched to the new version yet — checking again in 4 s…');
    await sleep(4000);
  }
  if (!st) throw new Error(T.netFail);
  throw new Error('Backend still reports the old release after 30 s (' + st.release + ').');
}
async function status() {
  const st = await check('version');
  log('Backend status: release ' + st.release + ', set up: ' + st.setUp + ', access code: ' + (st.codeFor ? (st.codeFor === st.release ? 'set by this release' : 'set by an earlier release') : 'not from this page') + ', extras: ' + (st.features || 'none') + ', keep-awake timer: ' + st.keepAwake + ', e-mail timer: ' + st.scanning + '.');
  return st;
}

// Signs in like the app and reads what the app reads when it opens (nothing is written to the person's data).
async function connectionCheck() {
  await signIn();
  const m = await api('getMeta');
  if (!m.data || !m.data.categories) throw new Error('The app answered, but without its starting data.');
  log('Read the app’s starting data back (' + (m._ms / 1000).toFixed(1) + ' s, ' + m.data.categories.length + ' categories).', 'ok');

// ---------- step 2: first approval (main web app, "this spreadsheet only") ----------
// Google's approval page now answers at once. The sheet is built from HERE, with a
// real progress bar (it used to be built while the person stared at a blank Google page).
async function buildSheet() {
  progress(T.p_build0, 10);
  let polling = true;
  (async () => {
    while (polling) {
      await sleep(1500);
      if (!polling) break;
      try {
        const p = await check('progress');
        if (p.total && !p.setUp) progress(T.p_build.replace('{n}', p.done).replace('{total}', p.total), 10 + 70 * p.done / p.total);
      } catch (e) { /* the next tick tries again */ }
    }
  })();
  const s = Date.now();
  try {
    const r = await check('build');
    if (!r.ok) throw new Error('build answered: ' + JSON.stringify(r));
    log('Sheet tabs + starter data built in ' + secs(s) + '.', 'ok');
  } catch (e) {
    // The phone may have lost the connection while Google kept building: ask whether it finished.
    log('The build call did not come back (' + e.message + ') — checking whether it finished…', 'bad');
    let ok = false;
    for (let i = 0; i < 30 && !ok; i++) { await sleep(3000); try { ok = (await check('progress')).setUp; } catch (e2) {} }
    if (!ok) throw new Error(T.buildFailed);
  } finally { polling = false; }
}
async function afterFirstApproval() {
  progress(T.p_check, 5, T.stepAllow);
  let st = await status();
  if (!st.setUp) { await buildSheet(); st = await status(); }
  if (!st.setUp) throw new Error(T.buildFailed);
  state.permissionDone = true; state.sentAt = 0; save();
  betaSend('approved');
  if (!state.accessCode || st.codeFor !== state.codeRelease) {
    progress(T.p_code2, 82);
    log('The backend does not have this page’s access code yet — sending it with an update…');

  progress(T.p_test, 92);
  await connectionCheck();
  if ((state.stages || []).includes('keepawake')) { const k = await status(); log('Keep-awake chosen at setup: ' + (k.keepAwake ? 'on' : 'NOT started'), k.keepAwake ? 'ok' : 'bad'); }
  if ((state.stages || []).includes('gmail')) {
    try { const g = await check('gmail'); state.gmailOk = !!g.ok; save(); log(g.ok ? 'Email reading chosen at setup works: ' + g.count + ' emails in the last 7 days (counted only).' : 'Email reading chosen at setup: ' + g.error, g.ok ? 'ok' : 'bad'); }
    catch (e) { log('Email reading chosen at setup could not be checked: ' + e.message, 'bad'); }

// The sign-in code lives only on the phone (never in Drive, never in the script text of the

  // The real app, opened in Safari from the next screen, finds this and offers "Copy my sign-in" itself, so the

async function continueAfterApproval() {

// The page notices an approval by itself: until it is given, Google answers the app's address
// with an approval page instead of data; once given, a tiny ping answers with data.
let watchTimer = null, watchSince = 0, showRetry = false;
function approvalTarget() { return state.pending ? state.pending.sideUrl : (state.webAppUrl && !state.permissionDone ? state.webAppUrl : null); }
function watchForApproval() {
  if (watchTimer || !approvalTarget()) return;
  watchSince = Date.now();
  watchTimer = setInterval(async () => {
    const tgt = approvalTarget();
    if (!tgt) { clearInterval(watchTimer); watchTimer = null; return; }
    if (busy || document.hidden) return;
    if (!showRetry && Date.now() - watchSince > 90000) { showRetry = true; render(); }
    try {
      const j = JSON.parse(await (await fetch(tgt + '?check=ping', { cache: 'no-store' })).text());
      if (!(j && j.ok)) return;
    } catch (e) { return; }
    clearInterval(watchTimer); watchTimer = null;
    log('Noticed the approval by itself — continuing.', 'ok');
    run(state.pending ? 'sAdd' : 's2', continueAfterApproval, null, state.pending ? T.stepAdd : T.stepAllow);
  }, 4000);
}

// ---------- extras turned on LATER: approved on a side copy first ----------
// The new permissions go to a SEPARATE deployment; the main one keeps running the previous version, so the app
// still works if the person abandons Google's screen. Only after approval is the main one switched over.
// Everything ticked is approved on ONE Google screen.
function addable() { return wantedExtras().filter((x) => !(state.stages || ['base']).includes(x)); }
async function startAdd() {
  const add = addable();
  if (!add.length) throw new Error(T.addNone);
  ensureCode();

  const release = new Date().toISOString();
  progress(T.p_prepare, 5, T.stepAdd);
  const versionNumber = await pushAndVersion(release, stages, 'Add ' + add.join('+'), 15);
  progress(T.p_publish, 70);
  const dep = await google_('POST', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments', { versionNumber, manifestFileName: 'appsscript', description: 'Approval ' + add.join('+') });
  state.pending = { stage: 'extras', stages, release, versionNumber, sideId: dep.deploymentId, sideUrl: webUrlOf(dep) };
  save(); saveProgressBg();
  log('Made a side deployment for the approval of: ' + add.join(' + ') + '.', 'ok');
  try { const st = await check('version'); log('Main app still answers while waiting for approval (release ' + st.release + ').', 'ok'); }
  catch (e) { log('Main app check while waiting: ' + e.message, 'bad'); }
  log('Going to Google for the approval of: ' + add.join(' + ') + '.');
  progress(T.p_going, 100);
  await progressChain;
  await accountReady;

async function finishAdd() {

  const added = p.stages.filter((x) => !(state.stages || ['base']).includes(x));
  const s = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + state.deploymentId,
    { deploymentConfig: { scriptId: state.scriptId, versionNumber: p.versionNumber, manifestFileName: 'appsscript', description: 'Main' } });
  try { await google_('DELETE', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + p.sideId); } catch (e) { log('Could not remove the side copy: ' + e.message); }
  state.stages = p.stages; state.release = p.release; state.versionNumber = p.versionNumber; state.codeRelease = p.release; state.pending = null; state.sentAt = 0;
  state.wanted = (state.wanted || []).filter((x) => !added.includes(x));
  save(); await saveProgress();
  log('Main app switched to the approved version ' + p.versionNumber + ' (' + secs(s) + ').', 'ok');
  progress(T.p_final, 60);
  const st = await waitForRelease(p.release);
  await ensureSignIn();
  progress(T.p_test, 80);
  await connectionCheck();
  handoff();
  if (added.includes('keepawake') && !st.keepAwake) throw new Error('The keep-awake timer is not on.');
  if (added.includes('gmail')) {
    const g = await check('gmail');
    if (!g.ok) throw new Error('Email reading: ' + g.error);
    log('Email reading works: ' + g.count + ' emails in the last 7 days (counted only).', 'ok');
    state.gmailOk = true; save();
  }
  say('sAdd', T.addDone);
}

// ---------- step 5: update (same permissions as now) ----------
async function update(quiet, keepCode) {
  const start = Date.now();
  if (!keepCode) ensureCode();   // keepCode: this page does not know the sign-in code; Install.gs then leaves the app's own code as it is
  const release = new Date().toISOString();
  const versionNumber = await pushAndVersion(release, state.stages || ['base'], 'Update', quiet ? 70 : 10, true, quiet ? { code: T.p_code2, version: T.p_code2 } : { code: T.p_updCode, version: T.p_updVersion });
  const s = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + state.deploymentId,
    { deploymentConfig: { scriptId: state.scriptId, versionNumber, manifestFileName: 'appsscript', description: 'Main' } });
  log('Switched the main app to version ' + versionNumber + ' (' + secs(s) + ').', 'ok');
  const st = await waitForRelease(release);
  state.release = release; state.versionNumber = versionNumber;
  if (st.codeFor === release) state.codeRelease = release;
  save(); saveProgressBg();
  if (!quiet && state.accessCode) await connectionCheck();
  log('Update finished in ' + secs(start) + '.', 'ok');
}

// Google keeps at most 200 saved versions per app and the API cannot delete them: every update uses one.
async function versionCount() {
  let n = 0, tok = '';
  do {
    const r = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/versions?pageSize=50' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''));
    n += (r.versions || []).length; tok = r.nextPageToken || '';
  } while (tok);
  return n;
}
// "Update my app": the same permissions, so Google asks for nothing new. Works from any phone signed in to the person's Google account:
// the app is found again in Drive (restoreIfNeeded) and its own sign-in code is left alone.
let updateJustDone = false;   // true once an update finishes here: switches the top banner to the "close and reopen" wording (render(), below)
async function updateMyApp() {
  progress(T.p_google, 5, T.stepUpdate);
  await restoreIfNeeded(true);
  accountReady = showAccount();
  if (!state.scriptId || !state.deploymentId) throw new Error(T.updNone);
  progress(T.p_updCheck, 12);
  const n = await versionCount();
  log('Your app holds ' + n + ' saved versions (Google keeps at most 200).', n >= 190 ? 'bad' : '');
  if (n >= 190) throw new Error(T.versionCap);
  await update(false, !state.accessCode);
  say('sUpd', T.updDone);
  updateJustDone = true;
}

// "Delete everything", step 2 (step 1 is backend/EraseAll.gs, done from the app): permanently deletes every app this page made in the
// signed-in Google account (the Sheet and the script bound to it; the owner's throwaway test apps count too, like Update), then takes back
// this page's own Google permission and forgets what this phone saved. Falls back to the trash if Drive refuses a permanent delete.
async function removeEverything() {
  progress(T.p_google, 5, T.stepRemove);
  const q = encodeURIComponent("(appProperties has { key='etSetup' and value='1' } or appProperties has { key='setupTest' and value='1' }) and trashed=false");
  progress(T.rmLooking, 20);
  const res = await google_('GET', 'https://www.googleapis.com/drive/v3/files?q=' + q + '&pageSize=100&fields=files(id,appProperties)');
  const files = res.files || [];
  log('Found ' + files.length + ' app(s) to delete.');
  let failed = null;
  // A 404 means the file is already gone or this page cannot see it (found 2026-10-23 on the spare account: the bound script
  // answered 404 and the whole delete was reported as failed). Nothing more can be done for it, so it is not a failure.
  const gone = (e) => /^404\b/.test(String(e && e.message));
  const drop = async (id) => {
    try { await google_('DELETE', 'https://www.googleapis.com/drive/v3/files/' + id); }
    catch (e) {
      if (gone(e)) { log('Already gone or not reachable (' + e.message + ') — skipping.'); return; }
      log('Permanent delete refused (' + e.message + ') — moving it to the trash instead.', 'bad');
      try { await google_('PATCH', 'https://www.googleapis.com/drive/v3/files/' + id, { trashed: true }); }
      catch (e2) { if (!gone(e2)) failed = failed || e2; }
    }
  };
  for (let i = 0; i < files.length; i++) {
    progress(T.rmWorking, 30 + Math.round(60 * i / files.length));
    const scriptId = files[i].appProperties && files[i].appProperties.scriptId;
    if (scriptId) await drop(scriptId);   // the app first, then the Sheet it belongs to
    await drop(files[i].id);
  }
  if (failed) throw new Error(T.rmFile.replace('{e}', failed.message));
  progress(T.rmWorking, 95);
  try { await new Promise((r) => google.accounts.oauth2.revoke(accessToken, r)); log('This page’s Google permission was removed.', 'ok'); }
  catch (e) { log('Could not revoke this page’s permission automatically: ' + e.message, 'bad'); }
  accessToken = null;
  try { sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(STORE_KEY); localStorage.removeItem(HANDOFF_KEY); localStorage.removeItem('etSigninHandoff'); } catch (e) {}
  state = {};
  say('sRm', files.length ? T.rmDone : T.rmNone);
  setTop('ok', '', files.length ? T.rmDone : T.rmNone, 100);
  $('btnRemove').hidden = true;
  $('rmDone').hidden = false;
}

// ---------- the one-time "Apps Script API" setting ----------
let apiRetryTimer = null, apiRetryUntil = 0, apiRetrying = false;
function startApiWait() {
  $('switchCard').hidden = false;
  $('switchCard').scrollIntoView({ block: 'start', behavior: 'smooth' });
  $('s1').innerHTML = '';
  apiRetryUntil = Date.now() + 5 * 60000;
  if (!apiRetryTimer) apiRetryTimer = setInterval(retryInstall, 20000);
  $('apiWait').textContent = T.switchWaiting;
  setTop('wait', '', T.p_switchWait);
}
async function retryInstall() {
  if (apiRetrying) return;
  if (Date.now() > apiRetryUntil) { clearInterval(apiRetryTimer); apiRetryTimer = null; $('apiWait').textContent = T.switchGaveUp; return; }
  apiRetrying = true;
  try {
    await install();
    clearInterval(apiRetryTimer); apiRetryTimer = null;
    $('apiWait').textContent = '';
    log('The Google setting is on — setup continued by itself.', 'ok');
    await goToFirstApproval();
  } catch (e) {
    if (e.apiOff) $('apiWait').textContent = T.switchNotYet.replace('{t}', new Date().toLocaleTimeString());
    else { log(e.message, 'bad'); $('apiWait').textContent = e.message; }
  } finally { apiRetrying = false; render(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastProgressAt = Date.now(); if (!document.hidden && apiRetryTimer) retryInstall(); });

async function goToFirstApproval() {
  if (state.permissionDone || !state.webAppUrl) return;
  say('s1', T.created);
  progress(T.p_going, 100, T.stepSetup);
  log('Going to the backend approval automatically (no tap).');
  await progressChain;   // make sure the progress note reached Drive, then go
  await accountReady;
  await sleep(2500);     // a brand-new app address needs a moment before Google serves it
  state.sentAt = Date.now(); save();
  betaSend('sent_to_google');
  log('Going to Google’s approval page: ' + withAccount(state.webAppUrl, 'return=…'));
  goTo(withAccount(state.webAppUrl, 'return=' + encodeURIComponent(backUrl())));
}

// ---------- coming back from Google ----------
async function handleReturn() {
  const done = location.hash.match(/^#done(?:&secs=(\d+))?/);
  const appr = location.hash.match(/^#approved=([a-z]+)/);
  if (!done && !appr) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (done) {
    betaSend('back_from_google');
    log('Back from Google: step 2 approved.', 'ok');
    await run('s2', afterFirstApproval, null, T.stepAllow);
  } else {
    log('Back from Google: "' + appr[1] + '" approved.', 'ok');
    await run('sAdd', finishAdd, null, T.stepAdd);
  }
}

// ---------- the extras chosen BEFORE setup: one approval screen covers them all ----------
const EXTRA_NAMES = ['keepawake', 'gmail'];
// Both optional extras start ticked (owner, 2026-10-21): until the person touches a box (which stores state.wanted) and before the app exists, "wanted" is all of them.
function wantedExtras() {
  if (state.wanted === undefined && !state.webAppUrl) return EXTRA_NAMES.slice();
  return (state.wanted || []).filter((x) => EXTRA_NAMES.includes(x));
}
function scopeCountFor(stages) { const u = new Set(); stages.forEach((x) => (STAGE_SCOPES[x] || []).forEach((y) => u.add(y))); return u.size; }
function renderChoices() {
  const stages = state.pending ? state.pending.stages : (state.stages || ['base']);
  const on = state.webAppUrl ? (state.stages || ['base']).filter((x) => EXTRA_NAMES.includes(x)) : [];
  const later = !!state.permissionDone && !state.pending;       // the app is set up: extras can be added now
  const fixed = !!state.webAppUrl && !later;                    // app exists but Google's approval is still open: choices are final
  const wanted = wantedExtras();
  const shown = !state.webAppUrl ? wanted : fixed ? stages.filter((x) => EXTRA_NAMES.includes(x)) : on.concat(wanted.filter((x) => !on.includes(x)));
  $('optAwake').checked = shown.includes('keepawake');
  $('optGmail').checked = shown.includes('gmail');
  $('optAwake').disabled = fixed || on.includes('keepawake');
  $('optGmail').disabled = fixed || on.includes('gmail');
  $('choicesIntroP').innerHTML = later ? T.choicesIntroAfter : T.choicesIntro;
  if (later) {
    const add = addable();
    const names = add.map((x) => (x === 'keepawake' ? T.choiceAwake : T.choiceGmail));
    $('choicesSummary').textContent = on.length === EXTRA_NAMES.length ? T.addAllOn : add.length ? T.addReady.replace('{list}', names.join(', ')) : T.addPickOne;
  } else if (fixed) {
    const names = [T.choiceBasics].concat(shown.includes('keepawake') ? [T.choiceAwake] : [], shown.includes('gmail') ? [T.choiceGmail] : []);
    $('choicesSummary').textContent = T.choicesLocked.replace('{list}', names.join(', '));
  } else {
    const n = scopeCountFor(['base'].concat(shown));
    $('choicesSummary').textContent = n === 1 ? T.choicesSummaryOne : T.choicesSummaryMany.replace('{n}', n);
  }
  $('btnAdd').hidden = !(later && addable().length);
  // what Google's approval page will list because of the extras (shown before the person gets there)
  const lines = [];
  if (!state.permissionDone) {
    if (shown.includes('keepawake')) lines.push(T.approveExtraAwake);
    if (shown.includes('gmail')) lines.push(T.approveExtraGmail);
  }
  $('approveExtras').hidden = !lines.length;
  $('approveExtras').innerHTML = lines.length ? '<b>' + T.approveExtrasTitle + '</b><ul>' + lines.map((l) => '<li>' + l + '</li>').join('') + '</ul>' : '';
}
['optAwake', 'optGmail'].forEach((id) => $(id).addEventListener('change', () => {
  state.wanted = [$('optAwake').checked ? 'keepawake' : null, $('optGmail').checked ? 'gmail' : null].filter(Boolean);
  save(); renderChoices();
}));

// ---------- wiring ----------
function doneBtn(id, done) {
  const b = $(id);
  b.classList.toggle('donebtn', !!done);
  b.textContent = done ? T.createdBtn : T[b.dataset.t];
}
// The list of steps at the top: a tick for each one already done, a dot on the one the person is on.
function renderTracker() {
  $('tracker').hidden = WANT_REMOVE || WANT_UPDATE;
  $('overview').hidden = !!state.spreadsheetId;   // "what will happen" is only for the start; the step list takes over
  const done = { trSheet: !!state.spreadsheetId, trApp: !!state.webAppUrl, trAllow: !!state.permissionDone, trOpen: false };
  $('trApp').querySelector('[data-t]').textContent = apiRetryTimer ? T.trSwitch : T.trApp;
  let now = true;
  Object.keys(done).forEach((id) => {
    const li = $(id);
    li.classList.toggle('done', done[id]);
    li.classList.toggle('now', now && !done[id]);
    li.querySelector('.dot').textContent = done[id] ? '✓' : (now ? '▸' : '·');
    if (!done[id]) now = false;
  });
  $('card1').classList.toggle('complete', !!state.webAppUrl);
  $('card2').classList.toggle('complete', !!state.permissionDone);
}
function render(failed) {
  renderChoices();
  renderTracker();
  if (!busy) $('sheetNote').hidden = true;   // the "don't delete your Sheet" note is only for the minute the Sheet is being made
  if (state.webAppUrl) $('switchCard').hidden = !apiRetryTimer;
  if (state.webAppUrl && !$('s1').textContent) say('s1', T.createdDone);
  renderAccount();
  if (state.permissionDone && !$('s2').textContent) say('s2', T.approved);
  $('readyCard').hidden = !state.permissionDone;
  $('updateCard').hidden = WANT_REMOVE || !(WANT_UPDATE || state.permissionDone);
  $('removeCard').hidden = !WANT_REMOVE;
  $('btnContinue').hidden = !showRetry || !!state.permissionDone;
  $('btnContinueAdd').hidden = !showRetry || !state.pending;
  // Shown only once the person has been sent to Google's approval page and is back here without approving.
  const help = !!(state.webAppUrl && (!state.permissionDone || state.pending) && !busy && state.sentAt);
  $('openHelp').hidden = !help;
  if (help) betaSend('help_card_shown');
  $('shareCard').hidden = !!state.permissionDone;
  // The Private-tab advice is for starting a setup (or turning extras on, which also goes through Google's approval screen);
  // an update asks Google for nothing new, and once the app exists the "can't open the file" card takes over.
  $('privateTip').hidden = WANT_UPDATE || !!state.webAppUrl;
  if (state.permissionDone) betaSend('ready');
  if (help) $('openHelp').querySelector('div').innerHTML = T.openHelpBody.replace('{account}', state.account || 'the account you chose');
  if (!busy) {
    // The main button always works: tapping it again resumes wherever setup stopped (closed tab,
    // closed Google window, lost sign-in). Found 2026-10-14: it used to read "Done" and go dead
    // once the app existed but was not yet approved, so closing Google's window stranded the person.
    let mainLabel = T.createBtn, mainDone = false;
    if (state.webAppUrl && !state.permissionDone) mainLabel = T.continueBtn;
    else if (state.webAppUrl && !state.accessCode) mainLabel = T.relinkBtn;
    else if (state.webAppUrl) { mainLabel = T.createdBtn; mainDone = true; }
    $('btnInstall').textContent = mainLabel;
    $('btnInstall').classList.toggle('donebtn', mainDone);
    $('btnInstall').disabled = false;
    renderAccount();   // re-applies the sign-in gate on the main button
  }
  if (!busy && !failed && !apiRetryTimer && !WANT_REMOVE) {   // the delete page writes its own status (removeEverything)
    if (state.pending) setTop('wait', T.stepAdd, T.p_wait);
    else if (state.permissionDone) setTop('ok', '', (WANT_UPDATE && updateJustDone) ? T.allDoneUpdate : T.allDone, 100);
    else if (state.pending || state.webAppUrl) setTop('wait', state.pending ? T.stepAdd : T.stepAllow, T.p_wait);
    else setTop('idle', '', (!WANT_UPDATE && !state.spreadsheetId && !signedIn()) ? T.readySignin : T.ready, 0);
  }
  if (!busy && approvalTarget()) watchForApproval();
}
let busy = false;
async function run(boxId, fn, btnId, step) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button:not([data-keep])').forEach((b) => { b.dataset.was = b.disabled; b.disabled = true; });
  activeBtn = btnId ? $(btnId) : null;
  if (activeBtn) { activeBtn.dataset.label = activeBtn.textContent; activeBtn.classList.add('busy'); }
  if (boxId) $(boxId).innerHTML = '';
  showRetry = false;
  currentStep = step || '';
  barFloor = 3;
  resetBar(3);
  setTop('running', currentStep, T.working, 3);
  startClock();
  const work = fn();   // started first: Google's sign-in window must open straight from the tap
  keepScreenOn(true);
  let failed = false;
  try { await work; }
  catch (e) {
    failed = true;
    log(e.message, 'bad');
    if (e.apiOff) { betaSend('api_switch_needed'); log('→ Showing the Google setting card.'); startApiWait(); failed = false; }
    else {
      betaSend('step_failed', { s1: 'create', s2: 'approve', sAdd: 'extras', sUpd: 'update', sRm: 'remove' }[boxId] || 'other');
      if (boxId) say(boxId, '✗ ' + e.message, 'err');
      setTop('err', currentStep, '✗ ' + e.message, 100);
      if (boxId === 's2' || boxId === 'sAdd' || approvalTarget()) showRetry = true;
    }
  } finally {
    busy = false; stopClock(); keepScreenOn(false);
    if (activeBtn) { activeBtn.classList.remove('busy'); activeBtn.textContent = activeBtn.dataset.label; activeBtn = null; }
    document.querySelectorAll('button:not([data-keep])').forEach((b) => { b.disabled = b.dataset.was === 'true'; });
    render(failed);
  }
}
$('btnInstall').addEventListener('click', () => { betaSend('tapped'); run('s1', async () => { await install(); await goToFirstApproval(); if (state.permissionDone) await repairSignIn(); }, 'btnInstall', T.stepSetup); });
// Two buttons copy the page address for a Private tab: the one in the card at the top (shown to everyone) and the one in the
// "can't open the file" card (shown after a failed trip to Google).
['btnCopyPrivate', 'btnCopyPage'].forEach((id) => $(id).addEventListener('click', async () => {
  const address = location.origin + location.pathname;
  try { await navigator.clipboard.writeText(address); log('Page address copied.'); $(id).textContent = T.copiedBtn; }
  catch (e) { log('Could not copy automatically.', 'bad'); try { window.prompt(T.copyManual, address); } catch (e2) {} }
}));
$('btnCopySignin').addEventListener('click', async () => {
  const msg = $('signinMsg');
  try {
    if (!state.webAppUrl || !state.accessCode) throw new Error(T.noSigninYet);
    await navigator.clipboard.writeText(signinText());
    log('Sign-in copied to the clipboard (' + SigninLink.PREFIX + '…).', 'ok');
    msg.className = 'small done'; msg.textContent = T.signinCopied;
  } catch (e) {
    log('Could not copy the sign-in: ' + e.message, 'bad');
    msg.className = 'small err'; msg.textContent = '✗ ' + e.message;
  }
});
$('btnCancel').addEventListener('click', () => { log('Stopped by the person — reloading; setup resumes where it was.'); location.reload(); });
$('btnContinue').addEventListener('click', () => run('s2', continueAfterApproval, null, T.stepAllow));
$('btnContinueAdd').addEventListener('click', () => run('sAdd', continueAfterApproval, null, T.stepAdd));
$('btnAdd').addEventListener('click', () => run('sAdd', startAdd, 'btnAdd', T.stepAdd));
$('btnChangeAcct').addEventListener('click', changeAccount);
$('btnSignin').addEventListener('click', signInFirst);
$('btnUpdate').addEventListener('click', () => run('sUpd', updateMyApp, 'btnUpdate', T.stepUpdate));
$('btnRemove').addEventListener('click', () => run('sRm', removeEverything, 'btnRemove', T.stepRemove));
$('btnCopy').addEventListener('click', async () => {
  const text = [...$('log').children].map((li) => li.textContent).join('\n') + '\n\nLanguage: ' + LANG + '\nUser agent: ' + navigator.userAgent;
  try { await navigator.clipboard.writeText(text); log('Log copied.'); } catch (e) { log('Could not copy automatically — select the log text by hand.', 'bad'); }
});
$('btnForget').addEventListener('click', () => {
  state = {}; save(); accessToken = null;
  beta.sent = {}; beta.t0 = 0; beta.fails = 0; betaSave();   // starting over restarts the count of steps too
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  log('This phone forgot the setup (your Google Sheet in Drive is untouched).');
  ['s1', 's2', 'sAdd'].forEach((id) => { $(id).innerHTML = ''; });
  renderAccount();
  try { localStorage.removeItem(HANDOFF_KEY); localStorage.removeItem('etSigninHandoff'); } catch (e) {}
  showRetry = false;
  render();
});

$('shareName').placeholder = T.sharePlaceholder;
$('shareName').value = beta.label || '';
$('optShare').checked = beta.on;
$('optShare').addEventListener('change', () => {
  beta.on = $('optShare').checked;
  if (!beta.on) beta.pending = [];   // unticked: whatever has not left yet never will
  betaSave();
  refreshHandoff();
});
$('shareName').addEventListener('input', () => { beta.label = PerfShare.cleanLabel($('shareName').value); betaSave(); refreshHandoff(); });
// The sign-in kept for the app carries the sharing choice, so it is rewritten whenever the choice changes after it was made.
function refreshHandoff() { try { if (state.webAppUrl && state.accessCode) localStorage.setItem('etSigninHandoff', signinText()); } catch (e) {} }
if (beta.pending.length) betaFlush();   // notes left over from before the page jumped to Google
render();
if (accessToken && !state.account) accountReady = showAccount();   // a sign-in from earlier in this tab: name its account too
if (WANT_UPDATE) setTimeout(() => { try { $('updateCard').scrollIntoView({ block: 'start' }); } catch (e) {} }, 200);
log('Ready (' + LANG + ').' + (state.webAppUrl ? ' Resuming an earlier test.' : ''));
handleReturn();
if (WANT_REMOVE) setTop('idle', '', T.rmReady, 0);
if (WANT_UPDATE) setTop('idle', '', T.updReady, 0);
</script>
