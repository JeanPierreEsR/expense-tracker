<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setup check">
<title>Setup check</title>
<!--
  PROTOTYPE ONLY — a stand-in for "the app opens here" at the end of the setup
  test. It answers ONE question for the real build: does an icon added to the
  iPhone home screen remember what the setup page saved (the app's address and
  sign-in code)? The setup page and this page share one address (same origin),
  so a plain Safari tab sees the saved values. The home-screen icon may or may
  not — iPhone can give home-screen apps their own separate storage. Holds no
  private data; shows only whether values exist, never the code itself.
-->
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1c; --card:#fff; --line:#d9d9d4; --ok:#14684a; --bad:#b3261e; --accent:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#f1f1f1; --card:#1f1f1f; --line:#3a3a3a; --ok:#4cc38a; --bad:#ff8a80; --accent:#8db3ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.5 -apple-system, Helvetica, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .yes { color:var(--ok); font-weight:700; } .no { color:var(--bad); font-weight:700; }
  button { font:inherit; font-weight:700; padding:16px; border-radius:12px; border:0; background:var(--accent); color:#fff; width:100%; min-height:56px; }
  @media (prefers-color-scheme: dark) { button { color:#0b1530; } }
  .small { font-size:15px; opacity:.85; }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <div class="card">
    <div class="row"><span data-t="rowStandalone"></span><span id="vStandalone">…</span></div>
    <div class="row"><span data-t="rowSaved"></span><span id="vSaved">…</span></div>
    <div class="row"><span data-t="rowSignin"></span><span id="vSignin">—</span></div>
  </div>
  <button id="btnTest" data-t="btnTest"></button>
  <p class="small" id="msg"></p>
  <p class="small" data-t="explain"></p>
</main>
<script>
const HANDOFF_KEY = 'setupTestHandoff';
let LANG = 'en';
try { LANG = localStorage.getItem('setupTestLang') || (((navigator.languages && navigator.languages[0]) || 'en').toLowerCase().startsWith('es') ? 'es' : 'en'); } catch (e) {}
const T = {
  en: {
    title: 'Your app opens here (test)',
    rowStandalone: 'Opened from the home-screen icon',
    rowSaved: 'Your app’s address is saved on this phone',
    rowSignin: 'Sign-in works',
    btnTest: 'Test the sign-in',
    yes: 'Yes', no: 'No',
    explain: 'This is a small test page standing in for your real app. Please do this: (1) look at the answers above in Safari, (2) add this page to your home screen, (3) open it from the new icon and look again. If “saved” says No from the icon, the home-screen icon does not share the setup with Safari — and we will design around that.',
    signing: 'Signing in…', ok: '✓ Signed in to your app.', fail: 'Could not sign in: ', nothing: 'Nothing is saved on this phone yet. Finish the setup page first (wait for the green “Your app is ready”), then open this page again.'
  },
  es: {
    title: 'Tu app se abre aquí (prueba)',
    rowStandalone: 'Abierta desde el ícono de la pantalla de inicio',
    rowSaved: 'La dirección de tu app está guardada en este teléfono',
    rowSignin: 'El inicio de sesión funciona',
    btnTest: 'Probar el inicio de sesión',
    yes: 'Sí', no: 'No',
    explain: 'Esta es una página pequeña de prueba que hace de tu app real. Por favor: (1) mira las respuestas de arriba en Safari, (2) agrega esta página a tu pantalla de inicio, (3) ábrela desde el nuevo ícono y mira otra vez. Si “guardada” dice No desde el ícono, el ícono no comparte la configuración con Safari — y lo resolveremos de otra forma.',
    signing: 'Iniciando sesión…', ok: '✓ Sesión iniciada en tu app.', fail: 'No se pudo iniciar sesión: ', nothing: 'Aún no hay nada guardado en este teléfono. Termina primero la página de configuración (espera el mensaje verde “Tu app está lista”) y luego abre esta página otra vez.'
  }
}[LANG];
document.documentElement.lang = LANG;
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.getAttribute('data-t')]; });
const $ = (id) => document.getElementById(id);
function mark(id, yes) { $(id).textContent = yes ? T.yes : T.no; $(id).className = yes ? 'yes' : 'no'; }
let saved = null;
try { saved = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null'); } catch (e) {}
mark('vStandalone', navigator.standalone === true || matchMedia('(display-mode: standalone)').matches);
mark('vSaved', !!(saved && saved.url && saved.code));
$('btnTest').addEventListener('click', async () => {
  $('msg').textContent = T.signing;
  try {
    if (!(saved && saved.url && saved.code)) { mark('vSignin', false); $('msg').textContent = T.nothing; return; }
    const res = await fetch(saved.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', payload: { code: saved.code, deviceName: 'Setup check page' } }) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'no');
    mark('vSignin', true); $('msg').textContent = T.ok;
  } catch (e) { mark('vSignin', false); $('msg').textContent = T.fail + e.message; }
});
</script>
</body>
</html>
