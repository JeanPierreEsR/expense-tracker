<title>Setup test</title>
<!--
  PROTOTYPE ONLY — a throwaway test of a "one-tap install" for friends & family.
  Not linked from the real app. It creates a spreadsheet + the app's private
  backend (from this public repo) in the Google account of whoever signs in,
  asking Google's permissions in separate steps (this spreadsheet only → run
  while away → read-only Gmail). Holds nothing private: the Client ID is a
  public identifier. Explanations follow the phone's language (Spanish or
  English); the log stays in English (it is for diagnosis).
  Wording rule (owner, 2026-10-14): never say "copy" or "tracker" to the person —
  it is "your app" (and "your Google Sheet" for the spreadsheet).
-->
<style>

  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.5 -apple-system, Helvetica, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; line-height:1.25; margin:8px 0 12px; }
  .banner { background:#fff3cd; color:#5c4400; border-radius:10px; padding:10px 12px; font-size:15px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .step h3 { margin:0 0 8px; font-size:20px; line-height:1.25; }
  .step p { margin:8px 0; color:var(--muted); font-size:17px; }
  .step ol, .step ul { padding-left:22px; }
  .ask { background:var(--note); border-radius:10px; padding:12px 14px; font-size:17px; margin:10px 0; }
  .ask b { display:inline; }
  .ask ul { margin:6px 0 0; padding-left:20px; }
  .ask li { margin:4px 0; }
  .ask p { margin:8px 0 0; }
  button { font:inherit; font-weight:700; font-size:19px; padding:16px 18px; border-radius:12px; border:0; background:var(--accent); color:#fff; width:100%; margin-top:8px; min-height:56px; }
  @media (prefers-color-scheme: dark) { button { color:#0b1530; } }
  button.secondary { background:transparent; color:var(--accent); border:2px solid var(--line); font-size:17px; }
  button:disabled { opacity:.5; }
  button.busy { opacity:1; position:relative; padding-left:48px; text-align:left; }
  button.busy::before { content:""; position:absolute; left:16px; top:50%; width:20px; height:20px; margin-top:-10px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 0.9s linear infinite; }
  @media (prefers-color-scheme: dark) { button.busy::before { border-color:rgba(11,21,48,.3); border-top-color:#0b1530; } }
  button.donebtn { background:var(--ok); opacity:1; }
  @media (prefers-color-scheme: dark) { button.donebtn { color:#06240f; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .done { color:var(--ok); font-weight:700; }
  .err { color:var(--bad); font-weight:700; }
  .callout { background:#fff3cd; color:#3d2e00; border-radius:14px; padding:16px; margin:12px 0; }
  .callout h3 { margin:0 0 8px; font-size:20px; }
  .callout ol { margin:8px 0 12px; padding-left:22px; }
  .callout p { font-size:17px; }
  .bigbtn { display:block; text-align:center; font-weight:700; font-size:19px; padding:16px; border-radius:12px; background:var(--accent); color:#fff !important; text-decoration:none; }
  @media (prefers-color-scheme: dark) { .bigbtn { color:#0b1530 !important; } }
  #log { font:12px/1.4 ui-monospace, Menlo, monospace; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 10px 10px 30px; max-height:320px; overflow:auto; }
  #log li.bad { color:var(--bad); } #log li.ok { color:var(--ok); }
  a { color:var(--accent); }
  .small { font-size:15px; }
  .opt { display:flex; gap:12px; align-items:flex-start; margin:12px 0; font-size:17px; color:var(--muted); }
  .opt input { width:26px; height:26px; flex:none; margin-top:2px; }
  /* general status, always visible at the top */
  .topstatus { position:sticky; top:0; z-index:10; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .topstatus .tsHead { display:flex; justify-content:space-between; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .topstatus #tsText { font-size:19px; font-weight:700; margin:4px 0 8px; }
  .topstatus .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  .topstatus #tsBar { height:100%; width:0; background:var(--accent); border-radius:6px; transition:width .5s ease; }
  .topstatus.running { border-color:var(--accent); }
  .topstatus.ok { border-color:var(--ok); } .topstatus.ok #tsBar { background:var(--ok); width:100% !important; } .topstatus.ok #tsText { color:var(--ok); }
  .topstatus.err { border-color:var(--bad); } .topstatus.err #tsBar { background:var(--bad); width:100% !important; } .topstatus.err #tsText { color:var(--bad); }
  .topstatus.idle .bar, .topstatus.wait .bar { display:none; }
  #tsKeep { margin-top:8px; color:var(--muted); }
</style>

<main>
  <p class="small" style="text-align:right;margin:0"><a href="#" data-lang="es">Español</a> · <a href="#" data-lang="en">English</a></p>
  <h1 data-t="title"></h1>
  <p class="banner" data-t="banner"></p>

  <div class="topstatus idle" id="topStatus" role="status" aria-live="polite">
    <div class="tsHead"><span id="tsStep"></span><span id="tsTime"></span></div>
    <div id="tsText"></div>
    <div class="bar"><div id="tsBar"></div></div>
    <div id="tsKeep" class="small" hidden data-t="keepOpen"></div>
    <button class="secondary" id="btnCancel" data-keep hidden data-t="cancelBtn"></button>
  </div>

  <div class="step" id="overview">
    <h3 data-t="whatTitle"></h3>
    <ol data-t="what"></ol>
  </div>

  <div class="step" id="choices">
    <h3 data-t="choicesTitle"></h3>
    <p data-t="choicesIntro"></p>
    <label class="opt"><input type="checkbox" id="optAwake"><span data-t="optAwakeLabel"></span></label>
    <label class="opt"><input type="checkbox" id="optGmail"><span data-t="optGmailLabel"></span></label>
    <p class="small" id="choicesSummary"></p>
  </div>

  <div class="callout" id="switchCard">
    <h3 data-t="switchTitle"></h3>
    <p style="color:inherit" data-t="switchIntro"></p>
    <ol data-t="switchSteps"></ol>
    <a class="bigbtn" href="https://script.google.com/home/usersettings" target="_blank" rel="noopener" data-t="switchBtn"></a>
    <p id="apiWait" style="color:inherit;margin-top:10px"></p>
  </div>

  <div class="step">
    <h3 data-t="createTitle"></h3>
    <div class="ask" data-t="createAsk"></div>
    <p class="small" id="acct"></p>
    <div id="s1"></div>
    <button id="btnInstall" data-t="createBtn"></button>
  </div>

  <div class="step">
    <h3 data-t="approveTitle"></h3>
    <div class="ask" data-t="approveAsk"></div>
    <div class="callout" id="openHelp" hidden>
      <h3 data-t="openHelpTitle"></h3>
      <div data-t="openHelpBody"></div>
      <button id="btnCopyPage" data-t="copyPageBtn"></button>
    </div>
    <div id="approveExtras" class="ask" hidden></div>
    <div id="s2"></div>
    <button class="secondary" id="btnContinue" data-t="retryBtn" hidden></button>
  </div>

  <div class="step" id="readyCard" hidden>
    <h3 data-t="readyTitle"></h3>
    <div data-t="readyBody"></div>
    <button id="btnCopySignin" data-t="copySigninBtn"></button>
    <p class="small" id="signinMsg"></p>
    <a class="bigbtn" id="openApp" href="../" data-t="readyBtn"></a>
  </div>

  <div class="step">
    <h3 data-t="testTitle"></h3>
    <p data-t="updateBody"></p>
    <div id="s5"></div>
    <button class="secondary" id="btnUpdate" data-t="updateBtn" disabled></button>
    <button class="secondary" id="btnDiag">Diagnose the app addresses (then Copy log)</button>
    <button class="secondary" id="btnStatus" disabled>Check backend status</button>
    <button class="secondary" id="btnCopy">Copy log</button>
    <button class="secondary" id="btnClearLog">Clear log</button>
    <button class="secondary" id="btnForget">Forget this test on this phone</button>
  </div>

  <h3>Log</h3>
  <ol id="log"></ol>
</main>

    let vt = null;

async function google_(method, url, body) {
  const token = await getToken();
  let res, text;
  // GET and PUT can safely be repeated. Found 2026-10-15: one upload to Google sat silent for 48 s and then
  // failed with Safari's bare "Load failed"; no log line said which call. Now each try is cut off after 25 s
  // and repeated (3 tries), and every failure is logged with what was called and how long it took.
  const tries = method === 'POST' ? 1 : 3;
  for (let attempt = 1; ; attempt++) {
    const t0 = Date.now(), ctl = new AbortController(), cut = setTimeout(() => ctl.abort(), method === 'POST' ? 90000 : 25000);
    try {
      res = await fetch(url, { method, signal: ctl.signal, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      text = await res.text();
      clearTimeout(cut);
      break;
    } catch (e) {
      clearTimeout(cut);
      log('Google call failed (' + method + ' ' + url.split('?')[0].replace('https://', '') + ', try ' + attempt + ' of ' + tries + ', ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s): ' + e.message + '.', 'bad');
      if (attempt >= tries) { const err = new Error(T.netFail); err.network = true; throw err; }
      await sleep(1500 * attempt);
    }
  }
  let json = {};
  try { json = text ? JSON.parse(text) : {}; } catch (e) {}
  if (!res.ok) {
    const msg = (json.error && json.error.message) || text.slice(0, 300) || ('HTTP ' + res.status);
    const err = new Error(res.status + ': ' + msg);
    err.apiOff = /Apps Script API|has not enabled|usersettings/i.test(msg);
    throw err;
  }
  return json;
}

  log('Fetched ' + files.length + ' backend files from GitHub (' + secs(start) + '); permissions: ' + stages.join(' + ') + '.');
  return files;
}
// A brand-new project is filled in by Google a moment AFTER it is created (a default code file and manifest).
// Hypothesis (2026-10-14): since the backend files are now downloaded in advance, our upload follows the project
// creation within a fraction of a second and can be overwritten by that late fill-in — leaving a project with no
// web app section, whose address Google then answers with "unable to open the file". The old page had a few
// seconds of other work in between. So: wait until the project is readable, pause, upload, then CHECK it stuck.
async function waitForProjectReady() {
  for (let i = 0; i < 10; i++) {
    try {
      const c = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content');
      if ((c.files || []).some((f) => f.name === 'appsscript')) { log('The new project is ready (' + c.files.length + ' starting files).', 'ok'); await sleep(2000); return; }
    } catch (e) { log('The new project is not readable yet: ' + e.message); }
    await sleep(1000);
  }
  log('The new project still was not readable after 10 s — continuing anyway.', 'bad');
}
async function verifyUpload(sent) {
  const c = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content');
  const names = (c.files || []).map((f) => f.name);
  const man = (c.files || []).find((f) => f.name === 'appsscript');
  const hasWeb = !!man && /"webapp"/.test(man.source);
  const hasFirstRun = names.includes('FirstRun');
  log('Check after upload: Google holds ' + names.length + ' files (sent ' + sent + '), FirstRun present: ' + hasFirstRun + ', manifest has the web app section: ' + hasWeb + '.', hasWeb && hasFirstRun ? 'ok' : 'bad');
  return hasWeb && hasFirstRun && names.length >= sent;
}
async function pushAndVersion(release, stages, label, basePct, fresh, texts) {
  texts = texts || { code: T.p_code, version: T.p_version };
  progress(texts.code, basePct, undefined, basePct + 18);
  const files = await backendFiles(release, stages, fresh);
  let start = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content', { files });
  log('Uploaded the code (' + secs(start) + ').', 'ok');
  if (!(await verifyUpload(files.length))) {
    log('The upload did not stick — sending it again.', 'bad');
    await sleep(3000);
    await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/content', { files });
    if (!(await verifyUpload(files.length))) throw new Error('Google did not keep the uploaded code. Tap the button to try again.');
  }
  progress(texts.version, basePct + 20, undefined, basePct + 34);
  start = Date.now();
  const v = await google_('POST', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/versions', { description: label + ' ' + release });
  log('Saved version ' + v.versionNumber + ' (' + secs(start) + ').', 'ok');
  return v.versionNumber;
}
function webUrlOf(dep) {
  const web = (dep.entryPoints || []).find((p) => p.entryPointType === 'WEB_APP');
  return (web && web.webApp && web.webApp.url) || execUrl(dep.deploymentId);
}

// ---------- step 1: install ----------
async function install() {
  const start = Date.now();
  progress(T.p_google, 3);
  await restoreIfNeeded();
  accountReady = showAccount();
  if (!state.spreadsheetId) {
    progress(T.p_sheet, 15);
    const s = Date.now();
    const sheet = await google_('POST', 'https://sheets.googleapis.com/v4/spreadsheets', { properties: { title: SHEET_TITLE } });
    state.spreadsheetId = sheet.spreadsheetId; state.spreadsheetUrl = sheet.spreadsheetUrl; save();
    saveProgressBg();
    log('Created the spreadsheet (' + secs(s) + ').', 'ok');
  }
  if (!state.scriptId) {
    progress(T.p_project, 30, undefined, 44);
    const s = Date.now();
    const proj = await google_('POST', 'https://script.googleapis.com/v1/projects', { title: BACKEND_TITLE, parentId: state.spreadsheetId });
    state.scriptId = proj.scriptId; save(); saveProgressBg();
    log('Created the backend "' + BACKEND_TITLE + '", attached to the spreadsheet (' + secs(s) + ').', 'ok');
    await waitForProjectReady();
  }
  if (!state.deploymentId) {
    ensureCode();
    state.release = new Date().toISOString();
    state.codeRelease = state.release;
    state.stages = ['base'].concat(wantedExtras());   // everything chosen is approved on ONE screen
    log('Setting up with: ' + state.stages.join(' + ') + '.');
    const versionNumber = await pushAndVersion(state.release, state.stages, 'Install', 45);
    progress(T.p_publish, 88, undefined, 97);
    const s = Date.now();
    const dep = await google_('POST', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments', { versionNumber, manifestFileName: 'appsscript', description: 'Main' });
    state.deploymentId = dep.deploymentId; state.webAppUrl = webUrlOf(dep); state.versionNumber = versionNumber;
    log('Google created the deployment: ' + JSON.stringify(dep));
    log('Web app entry reported for the new deployment: ' + ((dep.entryPoints || []).some((p) => p.entryPointType === 'WEB_APP') ? 'yes' : 'NO — this address will not work'), (dep.entryPoints || []).some((p) => p.entryPointType === 'WEB_APP') ? 'ok' : 'bad');
    save(); saveProgressBg();
    log('Published the backend (' + secs(s) + ').', 'ok');
  }
  $('switchCard').hidden = true;
  log('Step 1 finished in ' + secs(start) + '.', 'ok');
}

// ---------- calling the backend exactly like the app does ----------
async function callBackend(body) {
  const start = Date.now();
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      const res = await fetch(state.webAppUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      const json = await res.json();
      json._ms = Date.now() - start;
      return json;
    } catch (e) {
      if (attempt === 4) throw new Error('Backend unreachable: ' + e.message);
      log('Backend slow to wake up, retrying…');
      await sleep(500 * attempt);
    }
  }
}
async function signIn() {
  const r = await callBackend({ action: 'login', payload: { code: state.accessCode, deviceName: 'Setup test page' } });
  if (!r.ok) throw new Error('Sign-in failed: ' + r.error);
  state.sessionToken = r.data.sessionToken; save();
  log('Signed in to the backend (' + (r._ms / 1000).toFixed(1) + ' s' + (r.coldInstance ? ', cold start' : '') + ').', 'ok');
}
async function api(action, payload) {
  if (!state.sessionToken) await signIn();
  let r = await callBackend({ sessionToken: state.sessionToken, action, payload: payload || {} });
  if (!r.ok && r.code === 'invalid_access_code') { await signIn(); r = await callBackend({ sessionToken: state.sessionToken, action, payload: payload || {} }); }
  if (!r.ok) throw new Error(action + ' failed: ' + r.error);
  return r;
}
async function check(kind) {
  let text;
  try { text = await (await fetch(state.webAppUrl + '?check=' + kind, { cache: 'no-store' })).text(); }
  catch (e) { const err = new Error(T.netFail); err.network = true; log('Could not reach the app for "' + kind + '": ' + e.message + ' (address ends …' + String(state.webAppUrl).slice(-14) + ').', 'bad'); throw err; }
  try { return JSON.parse(text); } catch (e) { throw new Error('Backend answered with a page, not data (not approved yet?) — ' + text.slice(0, 120).replace(/\s+/g, ' ')); }
}
async function waitForRelease(release) {
  let st;
  for (let i = 0; i < 8; i++) {
    try { st = await status(); } catch (e) { if (!e.network) throw e; await sleep(4000); continue; }   // Google is often unreachable for a few seconds while it switches versions
    if (st && st.release === release) return st;
    log('Google has not switched to the new version yet — checking again in 4 s…');
    await sleep(4000);
  }
  if (!st) throw new Error(T.netFail);
  throw new Error('Backend still reports the old release after 30 s (' + st.release + ').');
}
async function status() {
  const st = await check('version');
  log('Backend status: release ' + st.release + ', set up: ' + st.setUp + ', access code: ' + (st.codeFor ? (st.codeFor === st.release ? 'set by this release' : 'set by an earlier release') : 'not from this page') + ', keep-awake: ' + st.keepAwake + ', last timer run: ' + (st.heartbeat || 'never') + '.');
  return st;
}

// Signs in like the app, saves a test entry (once) and reads it back.
async function connectionCheck() {
  await signIn();
  if (!state.testEntryId) {
    const created = await api('createEntry', { type: 'expense', date: new Date().toISOString().slice(0, 10), amount: 1, currency: 'PEN', description: 'Setup test entry' });
    state.testEntryId = created.data.id; save();
    log('Saved a test entry (' + (created._ms / 1000).toFixed(1) + ' s).', 'ok');
  }
  const back = await api('getEntry', { id: state.testEntryId });
  if (!back.data) throw new Error('The test entry could not be read back.');
  log('Read the test entry back: "' + back.data.description + '".', 'ok');
}

// ---------- step 2: first approval (main web app, "this spreadsheet only") ----------
// Google's approval page now answers at once. The sheet is built from HERE, with a
// real progress bar (it used to be built while the person stared at a blank Google page).
async function buildSheet() {
  progress(T.p_build0, 10);
  let polling = true;
  (async () => {
    while (polling) {
      await sleep(1500);
      if (!polling) break;
      try {
        const p = await check('progress');
        if (p.total && !p.setUp) progress(T.p_build.replace('{n}', p.done).replace('{total}', p.total), 10 + 70 * p.done / p.total);
      } catch (e) { /* the next tick tries again */ }
    }
  })();
  const s = Date.now();
  try {
    const r = await check('build');
    if (!r.ok) throw new Error('build answered: ' + JSON.stringify(r));
    log('Sheet tabs + starter data built in ' + secs(s) + '.', 'ok');
  } catch (e) {
    // The phone may have lost the connection while Google kept building: ask whether it finished.
    log('The build call did not come back (' + e.message + ') — checking whether it finished…', 'bad');
    let ok = false;
    for (let i = 0; i < 30 && !ok; i++) { await sleep(3000); try { ok = (await check('progress')).setUp; } catch (e2) {} }
    if (!ok) throw new Error(T.buildFailed);
  } finally { polling = false; }
}
async function afterFirstApproval() {
  progress(T.p_check, 5, T.stepAllow);
  let st = await status();
  if (!st.setUp) { await buildSheet(); st = await status(); }
  if (!st.setUp) throw new Error(T.buildFailed);
  state.permissionDone = true; state.sentAt = 0; save();
  if (!state.accessCode || st.codeFor !== state.codeRelease) {
    progress(T.p_code2, 82);
    log('The backend does not have this page’s access code yet — sending it with an update…');
    await update(true);
  }
  progress(T.p_test, 92);
  await connectionCheck();
  if ((state.stages || []).includes('keepawake')) { const k = await status(); log('Keep-awake chosen at setup: ' + (k.keepAwake ? 'on' : 'NOT started'), k.keepAwake ? 'ok' : 'bad'); }
  if ((state.stages || []).includes('gmail')) {
    try { const g = await check('gmail'); state.gmailOk = !!g.ok; save(); log(g.ok ? 'Email reading chosen at setup works: ' + g.count + ' emails in the last 7 days (counted only).' : 'Email reading chosen at setup: ' + g.error, g.ok ? 'ok' : 'bad'); }
    catch (e) { log('Email reading chosen at setup could not be checked: ' + e.message, 'bad'); }
  }
  handoff();
  say('s2', T.approved);
  try { await saveProgress(); } catch (e) { log('Could not save progress to Drive (will retry later): ' + e.message); }
}
// The sign-in code lives only on the phone (never in Drive, never in the script text of the
// setup page). If the phone forgot it — a private tab was closed, Safari data cleared, a new
// phone — the setup page, which still has Google's authority over the person's own app, makes
// a NEW code and sends it with an update. Found 2026-10-14: resuming without this gave
// "Sign-in failed: Wrong access code".
async function ensureSignIn() {
  if (state.accessCode) return false;
  progress(T.p_code2, 82);
  log('This phone no longer has the app’s sign-in code (the test was forgotten or the tab was closed) — making a new one and sending it to your app…');
  await update(true);   // update() makes the code (ensureCode), pushes a new version and switches to it
  return true;
}
// Used when the setup page finds an app that was already fully set up: make sure THIS phone can sign in.
async function repairSignIn() {
  const remade = await ensureSignIn();
  if (remade || !localStorage.getItem(HANDOFF_KEY)) {
    progress(T.p_test, 92);
    await connectionCheck();
    handoff();
    say('s2', T.approved);
  }
}
// What the home-screen check page (app-check.html) reads: the address and sign-in code of the person's app.
function handoff() {
  try { localStorage.setItem(HANDOFF_KEY, JSON.stringify({ url: state.webAppUrl, code: state.accessCode, at: Date.now() })); } catch (e) {}
  // The real app, opened in Safari from the next screen, finds this and offers "Copy my sign-in" itself, so the
  // person pastes only once (in the Home Screen icon). Same Safari storage, same address as this page.
  try { if (state.webAppUrl && state.accessCode) localStorage.setItem('etSigninHandoff', SigninLink.make(state.webAppUrl, state.accessCode)); } catch (e) {}
}
async function continueAfterApproval() {
  await restoreIfNeeded();
  if (!state.webAppUrl) throw new Error('No app found for this Google account yet — tap “' + T.createBtn + '” first.');
  if (state.pending) return finishStage(state.pending.stage);
  await afterFirstApproval();
}

// The page notices an approval by itself: until it is given, Google answers the app's address
// with an approval page instead of data; once given, a tiny ping answers with data.
let watchTimer = null, watchSince = 0, showRetry = false;
function approvalTarget() { return state.pending ? state.pending.sideUrl : (state.webAppUrl && !state.permissionDone ? state.webAppUrl : null); }
function watchForApproval() {
  if (watchTimer || !approvalTarget()) return;
  watchSince = Date.now();
  watchTimer = setInterval(async () => {
    const tgt = approvalTarget();
    if (!tgt) { clearInterval(watchTimer); watchTimer = null; return; }
    if (busy || document.hidden) return;
    if (!showRetry && Date.now() - watchSince > 90000) { showRetry = true; render(); }
    try {
      const j = JSON.parse(await (await fetch(tgt + '?check=ping', { cache: 'no-store' })).text());
      if (!(j && j.ok)) return;
    } catch (e) { return; }
    clearInterval(watchTimer); watchTimer = null;
    log('Noticed the approval by itself — continuing.', 'ok');
    run('s2', continueAfterApproval, null, T.stepAllow);
  }, 4000);
}

// ---------- steps 3-4: extra permissions, approved on a side copy first ----------
// The new permissions go to a SEPARATE deployment; the main one keeps running
// the previous version, so the app still works if the person abandons Google's
// screen. Only after approval is the main one switched over.
async function startStage(stage) {
  ensureCode();
  const stages = [...new Set([...(state.stages || ['base']), stage])];
  const release = new Date().toISOString();
  progress(T.p_prepare, 5);
  const versionNumber = await pushAndVersion(release, stages, 'Stage ' + stage, 15);
  progress(T.p_publish, 70);
  const dep = await google_('POST', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments', { versionNumber, manifestFileName: 'appsscript', description: 'Approval ' + stage });
  state.pending = { stage, stages, release, versionNumber, sideId: dep.deploymentId, sideUrl: webUrlOf(dep) };
  save(); saveProgressBg();
  log('Made a side deployment for the "' + stage + '" approval.', 'ok');
  try { const st = await check('version'); log('Main app still answers while waiting for approval (release ' + st.release + ').', 'ok'); }
  catch (e) { log('Main app check while waiting: ' + e.message, 'bad'); }
  log('Going to Google for the "' + stage + '" approval.');
  progress(T.p_going, 100);
  await progressChain;
  await accountReady;
  await sleep(2500);
  state.sentAt = Date.now(); save();
  goTo(withAccount(state.pending.sideUrl, 'stage=' + encodeURIComponent(stage) + '&return=' + encodeURIComponent(backUrl())));
}
async function finishStage(stage) {
  progress(T.p_switch, 20);
  const p = state.pending;
  if (!p || p.stage !== stage) throw new Error('No “' + stage + '” approval is waiting.');
  const s = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + state.deploymentId,
    { deploymentConfig: { scriptId: state.scriptId, versionNumber: p.versionNumber, manifestFileName: 'appsscript', description: 'Main' } });
  try { await google_('DELETE', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + p.sideId); } catch (e) { log('Could not remove the side copy: ' + e.message); }
  state.stages = p.stages; state.release = p.release; state.versionNumber = p.versionNumber; state.codeRelease = p.release; state.pending = null;
  save(); await saveProgress();
  log('Main app switched to the approved version ' + p.versionNumber + ' (' + secs(s) + ').', 'ok');
  progress(T.p_final, 60);
  const st = await waitForRelease(p.release);
  await ensureSignIn();
  progress(T.p_test, 80);
  await connectionCheck();
  handoff();
  if (stage === 'keepawake' && !st.keepAwake) throw new Error('Keep-awake timer is not on.');
  if (stage === 'gmail') {
    const g = await check('gmail');
    if (!g.ok) throw new Error('Email reading: ' + g.error);
    log('Email reading works: ' + g.count + ' emails in the last 7 days (counted only).', 'ok');
    state.gmailOk = true; save();
  }
}

// ---------- step 5: update (same permissions as now) ----------
async function update(quiet) {
  const start = Date.now();
  ensureCode();
  const release = new Date().toISOString();
  const versionNumber = await pushAndVersion(release, state.stages || ['base'], 'Update', quiet ? 70 : 10, true, quiet ? { code: T.p_code2, version: T.p_code2 } : null);
  const s = Date.now();
  await google_('PUT', 'https://script.googleapis.com/v1/projects/' + state.scriptId + '/deployments/' + state.deploymentId,
    { deploymentConfig: { scriptId: state.scriptId, versionNumber, manifestFileName: 'appsscript', description: 'Main' } });
  log('Switched the main app to version ' + versionNumber + ' (' + secs(s) + ').', 'ok');
  const st = await waitForRelease(release);
  state.release = release; state.versionNumber = versionNumber;
  if (st.codeFor === release) state.codeRelease = release;
  save(); saveProgressBg();
  if (!quiet) { await connectionCheck(); say('s5', T.updated); }
  log('Update finished in ' + secs(start) + '.', 'ok');
}

// ---------- diagnosis: what does Google actually hold for the apps this test created? ----------
// Found 2026-10-14: newly created apps answer "Google Drive: unable to open the file" at their address, and
// Google answers HTTP 404 for one of them. This asks Google directly about THIS phone's app, then lists every
// test sheet in Drive (trashed or not). Full addresses are logged so they can be tried from outside.
async function describeApp(scriptId) {
  const deps = await google_('GET', 'https://script.googleapis.com/v1/projects/' + scriptId + '/deployments');
  for (const d of (deps.deployments || [])) {
    const web = (d.entryPoints || []).find((p) => p.entryPointType === 'WEB_APP');
    log('    deployment ' + d.deploymentId + ' | version ' + (d.deploymentConfig && d.deploymentConfig.versionNumber) + ' | "' + (d.deploymentConfig && d.deploymentConfig.description) + '" | updated ' + d.updateTime + ' | web app entry: ' + (web ? 'yes' : 'NO') + (web && web.webApp ? ' | config ' + JSON.stringify(web.webApp.entryPointConfig || {}) : ''));
    if (web && web.webApp && web.webApp.url) log('      address: ' + web.webApp.url);
    else if (d.deploymentId !== '@HEAD') log('      no address listed; built address: ' + execUrl(d.deploymentId));
  }
  const c = await google_('GET', 'https://script.googleapis.com/v1/projects/' + scriptId + '/content');
  const man = (c.files || []).find((x) => x.name === 'appsscript');
  log('    files: ' + (c.files || []).length + ' | manifest: ' + (man ? man.source.replace(/\s+/g, ' ') : 'MISSING'));
}
async function diagnose() {
  log('--- Diagnosis start ---');
  try { const a = await google_('GET', 'https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)'); log('Signed in to Google as ' + (a.user && a.user.emailAddress) + '.'); } catch (e) { log('Could not read the account: ' + e.message, 'bad'); }

  // 1. the app THIS phone is working on
  log('This phone’s app: script ' + (state.scriptId || 'none') + ' | sheet ' + (state.spreadsheetId || 'none') + ' | deployment ' + (state.deploymentId || 'none') + ' | address ' + (state.webAppUrl || 'none'));
  if (state.scriptId) {
    try {
      const p = await google_('GET', 'https://script.googleapis.com/v1/projects/' + state.scriptId);
      log('  script project exists: "' + p.title + '" | parent file ' + (p.parentId || 'none') + ' | created ' + p.createTime + ' | updated ' + p.updateTime);
      if (p.parentId) {
        try {
          const f = await google_('GET', 'https://www.googleapis.com/drive/v3/files/' + p.parentId + '?fields=id,name,trashed,createdTime,appProperties');
          log('  its sheet: "' + f.name + '" | TRASHED: ' + f.trashed + ' | created ' + f.createdTime + ' | saved-progress keys: ' + Object.keys(f.appProperties || {}).join(',') );
        } catch (e) { log('  its sheet: ' + e.message, 'bad'); }
      }
      await describeApp(state.scriptId);
    } catch (e) { log('  script project: ' + e.message, 'bad'); }
  }

  // 2. every test sheet in Drive that this page can see, trashed or not
  try {
    const q = encodeURIComponent("mimeType='application/vnd.google-apps.spreadsheet' and name contains 'Expense Tracker'");
    const res = await google_('GET', 'https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=createdTime&fields=files(id,name,trashed,createdTime,appProperties)');
    const sheets = res.files || [];
    log('Test sheets this page can see in Drive (including trashed): ' + sheets.length + '.');
    for (const f of sheets) {
      const ap = f.appProperties || {};
      log('· "' + f.name + '" | created ' + f.createdTime + ' | trashed ' + f.trashed + ' | script ' + (ap.scriptId || '—') + ' | deployment ' + (ap.deploymentId || '—') + ' | approved ' + (ap.permissionDone || 'no'));
      if (!f.trashed && ap.scriptId && ap.scriptId !== state.scriptId) { try { await describeApp(ap.scriptId); } catch (e) { log('    could not read this app: ' + e.message, 'bad'); } }
    }
  } catch (e) { log('Could not list the test sheets: ' + e.message, 'bad'); }
  log('--- Diagnosis end — tap “Copy log” and send it ---', 'ok');
  say('s5', '✓ Diagnosis written to the log. Tap “Copy log” and send it.');
}

// ---------- the one-time "Apps Script API" setting ----------
let apiRetryTimer = null, apiRetryUntil = 0, apiRetrying = false;
function startApiWait() {
  $('switchCard').hidden = false;
  $('switchCard').scrollIntoView({ block: 'start', behavior: 'smooth' });
  $('s1').innerHTML = '';
  apiRetryUntil = Date.now() + 5 * 60000;
  if (!apiRetryTimer) apiRetryTimer = setInterval(retryInstall, 20000);
  $('apiWait').textContent = T.switchWaiting;
  setTop('wait', '', T.p_switchWait);
}
async function retryInstall() {
  if (apiRetrying) return;
  if (Date.now() > apiRetryUntil) { clearInterval(apiRetryTimer); apiRetryTimer = null; $('apiWait').textContent = T.switchGaveUp; return; }
  apiRetrying = true;
  try {
    await install();
    clearInterval(apiRetryTimer); apiRetryTimer = null;
    $('apiWait').textContent = '';
    log('The Google setting is on — setup continued by itself.', 'ok');
    await goToFirstApproval();
  } catch (e) {
    if (e.apiOff) $('apiWait').textContent = T.switchNotYet.replace('{t}', new Date().toLocaleTimeString());
    else { log(e.message, 'bad'); $('apiWait').textContent = e.message; }
  } finally { apiRetrying = false; render(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastProgressAt = Date.now(); if (!document.hidden && apiRetryTimer) retryInstall(); });

async function goToFirstApproval() {
  if (state.permissionDone || !state.webAppUrl) return;
  say('s1', T.created);
  progress(T.p_going, 100, T.stepSetup);
  log('Going to the backend approval automatically (no tap).');
  await progressChain;   // make sure the progress note reached Drive, then go
  await accountReady;
  await sleep(2500);     // a brand-new app address needs a moment before Google serves it
  state.sentAt = Date.now(); save();
  log('Going to Google’s approval page: ' + withAccount(state.webAppUrl, 'return=…'));
  goTo(withAccount(state.webAppUrl, 'return=' + encodeURIComponent(backUrl())));
}

// ---------- coming back from Google ----------
async function handleReturn() {
  const done = location.hash.match(/^#done(?:&secs=(\d+))?/);
  const appr = location.hash.match(/^#approved=([a-z]+)/);
  if (!done && !appr) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (done) {
    log('Back from Google: step 2 approved.', 'ok');
    await run('s2', afterFirstApproval, null, T.stepAllow);
  } else {
    log('Back from Google: "' + appr[1] + '" approved.', 'ok');
    await run('s2', () => finishStage(appr[1]), null, T.stepOptional);
  }
}

// ---------- the extras chosen BEFORE setup: one approval screen covers them all ----------
const EXTRA_NAMES = ['keepawake', 'gmail'];
function wantedExtras() { return (state.wanted || []).filter((x) => EXTRA_NAMES.includes(x)); }
function scopeCountFor(stages) { const u = new Set(); stages.forEach((x) => (STAGE_SCOPES[x] || []).forEach((y) => u.add(y))); return u.size; }
function renderChoices() {
  const locked = !!state.webAppUrl;
  const chosen = locked ? (state.stages || ['base']).filter((x) => EXTRA_NAMES.includes(x)) : wantedExtras();
  $('optAwake').checked = chosen.includes('keepawake');
  $('optGmail').checked = chosen.includes('gmail');
  $('optAwake').disabled = locked; $('optGmail').disabled = locked;
  if (locked) {
    const names = [T.choiceBasics].concat(chosen.includes('keepawake') ? [T.choiceAwake] : [], chosen.includes('gmail') ? [T.choiceGmail] : []);
    $('choicesSummary').textContent = T.choicesLocked.replace('{list}', names.join(', '));
  } else {
    const n = scopeCountFor(['base'].concat(chosen));
    $('choicesSummary').textContent = n === 1 ? T.choicesSummaryOne : T.choicesSummaryMany.replace('{n}', n);
  }
  // what Google's approval page will list because of the extras (shown before the person gets there)
  const lines = [];
  if (chosen.includes('keepawake')) lines.push(T.approveExtraAwake);
  if (chosen.includes('gmail')) lines.push(T.approveExtraGmail);
  $('approveExtras').hidden = !lines.length;
  $('approveExtras').innerHTML = lines.length ? '<b>' + T.approveExtrasTitle + '</b><ul>' + lines.map((l) => '<li>' + l + '</li>').join('') + '</ul>' : '';
}
['optAwake', 'optGmail'].forEach((id) => $(id).addEventListener('change', () => {
  state.wanted = [$('optAwake').checked ? 'keepawake' : null, $('optGmail').checked ? 'gmail' : null].filter(Boolean);
  save(); renderChoices();
}));

// ---------- wiring ----------
function doneBtn(id, done) {
  const b = $(id);
  b.classList.toggle('donebtn', !!done);
  b.textContent = done ? T.createdBtn : T[b.dataset.t];
}
function render(failed) {
  renderChoices();
  if (state.webAppUrl) $('switchCard').hidden = !apiRetryTimer;
  if (state.webAppUrl && !$('s1').textContent) say('s1', T.createdDone);
  if (state.account) $('acct').textContent = T.account.replace('{e}', state.account);
  if (state.permissionDone && !$('s2').textContent) say('s2', T.approved);
  $('btnUpdate').disabled = !state.permissionDone;
  $('btnStatus').disabled = !state.webAppUrl;
  $('readyCard').hidden = !state.permissionDone;
  $('btnContinue').hidden = !showRetry || !!state.permissionDone;
  // Shown only once the person has been sent to Google's approval page and is back here without approving.
  const help = !!(state.webAppUrl && !state.permissionDone && !busy && state.sentAt);
  $('openHelp').hidden = !help;
  if (help) $('openHelp').querySelector('div').innerHTML = T.openHelpBody.replace('{account}', state.account || 'the account you chose');
  if (!busy) {
    // The main button always works: tapping it again resumes wherever setup stopped (closed tab,
    // closed Google window, lost sign-in). Found 2026-10-14: it used to read "Done" and go dead
    // once the app existed but was not yet approved, so closing Google's window stranded the person.
    let mainLabel = T.createBtn, mainDone = false;
    if (state.webAppUrl && !state.permissionDone) mainLabel = T.continueBtn;
    else if (state.webAppUrl && !state.accessCode) mainLabel = T.relinkBtn;
    else if (state.webAppUrl) { mainLabel = T.createdBtn; mainDone = true; }
    $('btnInstall').textContent = mainLabel;
    $('btnInstall').classList.toggle('donebtn', mainDone);
    $('btnInstall').disabled = false;
  }
  if (!busy && !failed && !apiRetryTimer) {
    if (state.permissionDone) setTop('ok', '', T.allDone, 100);
    else if (state.pending || state.webAppUrl) setTop('wait', T.stepAllow, T.p_wait);
    else setTop('idle', '', T.ready, 0);
  }
  if (!busy && approvalTarget()) watchForApproval();
}
let busy = false;
async function run(boxId, fn, btnId, step) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button:not([data-keep])').forEach((b) => { b.dataset.was = b.disabled; b.disabled = true; });
  activeBtn = btnId ? $(btnId) : null;
  if (activeBtn) { activeBtn.dataset.label = activeBtn.textContent; activeBtn.classList.add('busy'); }
  if (boxId) $(boxId).innerHTML = '';
  showRetry = false;
  currentStep = step || '';
  barFloor = 3;
  setTop('running', currentStep, T.working, 3);
  startClock();
  const work = fn();   // started first: Google's sign-in window must open straight from the tap
  keepScreenOn(true);
  let failed = false;
  try { await work; }
  catch (e) {
    failed = true;
    log(e.message, 'bad');
    if (e.apiOff) { log('→ Showing the Google setting card.'); startApiWait(); failed = false; }
    else {
      if (boxId) say(boxId, '✗ ' + e.message, 'err');
      setTop('err', currentStep, '✗ ' + e.message, 100);
      if (boxId === 's2' || approvalTarget()) showRetry = true;
    }
  } finally {
    busy = false; stopClock(); keepScreenOn(false);
    if (activeBtn) { activeBtn.classList.remove('busy'); activeBtn.textContent = activeBtn.dataset.label; activeBtn = null; }
    document.querySelectorAll('button:not([data-keep])').forEach((b) => { b.disabled = b.dataset.was === 'true'; });
    render(failed);
  }
}
$('btnInstall').addEventListener('click', () => run('s1', async () => { await install(); await goToFirstApproval(); if (state.permissionDone) await repairSignIn(); }, 'btnInstall', T.stepSetup));
$('btnCopyPage').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.origin + location.pathname); log('Page address copied.'); $('btnCopyPage').textContent = T.copiedBtn; }
  catch (e) { log('Could not copy automatically.', 'bad'); }
});
$('btnCopySignin').addEventListener('click', async () => {
  const msg = $('signinMsg');
  try {
    if (!state.webAppUrl || !state.accessCode) throw new Error(T.noSigninYet);
    await navigator.clipboard.writeText(SigninLink.make(state.webAppUrl, state.accessCode));
    log('Sign-in copied to the clipboard (' + SigninLink.PREFIX + '…).', 'ok');
    msg.className = 'small done'; msg.textContent = T.signinCopied;
  } catch (e) {
    log('Could not copy the sign-in: ' + e.message, 'bad');
    msg.className = 'small err'; msg.textContent = '✗ ' + e.message;
  }
});
$('btnCancel').addEventListener('click', () => { log('Stopped by the person — reloading; setup resumes where it was.'); location.reload(); });
$('btnContinue').addEventListener('click', () => run('s2', continueAfterApproval, null, T.stepAllow));
$('btnUpdate').addEventListener('click', () => run('s5', () => update(false), 'btnUpdate', ''));
$('btnDiag').addEventListener('click', () => run('s5', diagnose, 'btnDiag', ''));
$('btnStatus').addEventListener('click', () => run(null, status, 'btnStatus', ''));
$('btnClearLog').addEventListener('click', () => { savedLog = []; try { localStorage.removeItem(LOG_KEY); } catch (e) {} $('log').innerHTML = ''; log('Log cleared.'); });
$('btnCopy').addEventListener('click', async () => {
  const text = [...$('log').children].map((li) => li.textContent).join('\n') + '\n\nLanguage: ' + LANG + '\nUser agent: ' + navigator.userAgent;
  try { await navigator.clipboard.writeText(text); log('Log copied.'); } catch (e) { log('Could not copy automatically — select the log text by hand.', 'bad'); }
});
$('btnForget').addEventListener('click', () => {
  state = {}; save(); accessToken = null;
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  log('This phone forgot the test (the tracker in Drive is untouched).');
  ['s1', 's2', 's5'].forEach((id) => { $(id).innerHTML = ''; });
  $('acct').textContent = '';
  try { localStorage.removeItem(HANDOFF_KEY); localStorage.removeItem('etSigninHandoff'); } catch (e) {}
  showRetry = false;
  render();
});

render();
log('Ready (' + LANG + ').' + (state.webAppUrl ? ' Resuming an earlier test.' : ''));
handleReturn();
</script>
</body>
</html>
