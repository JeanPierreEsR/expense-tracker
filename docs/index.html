<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
  </header>

  <div id="setup-screen" class="setup-screen" hidden>
    <p>Enter the access code to connect this app to your Google Sheet.</p>
    <form id="setup-form">
      <input type="password" id="setup-code-input" placeholder="Access code" autocomplete="off" required>
      <button type="submit" class="primary">Connect</button>
    </form>
    <p class="hint" id="setup-error" style="color:#d64545;"></p>
  </div>

  <div id="loading-screen" class="status-msg" hidden>
    Connecting… this can take up to 20 seconds if the app hasn't been used in a while.
  </div>

  <main id="app" hidden>
    <div class="card">
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense">Expense</div>
        <div class="type-tab" data-type="income">Income</div>
        <div class="type-tab" data-type="investment">Investment</div>
        <div class="type-tab" data-type="transfer">Transfer</div>
      </div>

      <form id="entry-form">
        <div class="row">
          <div>
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label for="currency">Currency</label>
            <select id="currency">
              <option value="PEN">PEN</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>

        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>

        <label for="category">Category</label>
        <select id="category" required></select>

        <label for="description">Description</label>
        <input type="text" id="description" placeholder="Optional">

        <label for="paid_by">Paid by</label>
        <select id="paid_by"></select>

        <div id="payment-method-field">
          <label for="payment_method">Payment method</label>
          <select id="payment_method"></select>
        </div>

        <label>Tags</label>
        <div class="tags-list" id="tags-list"></div>
        <div class="add-inline" id="add-tag-btn">+ Add tag…</div>

        <p class="hint" id="form-error" style="color:#d64545;"></p>
        <button type="submit" class="primary" id="submit-btn">Save entry</button>
      </form>
    </div>

    <div class="card entry-list">
      <h2>Recent entries</h2>
      <div id="entry-list"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
